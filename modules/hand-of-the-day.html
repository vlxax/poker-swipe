<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>PokerSwipe — Рука дня</title>
<style>html,body{margin:0;background:#030504;color:#c8ff3d;font-family:system-ui,sans-serif}#boot{padding:24px}</style>
</head>
<body>
<div id="boot">Загрузка Руки дня…</div>
<script>
(function(){
  function b64ToU8(b64) {
    var bin = atob(b64);
    var u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return u8;
  }
  async function main() {
    try {
      var ra = await fetch('hand-of-the-day.b64.a?v=1');
      var rb = await fetch('hand-of-the-day.b64.b?v=1');
      if (!ra.ok || !rb.ok) throw new Error('b64 parts HTTP ' + ra.status + '/' + rb.status);
      var B64 = ((await ra.text()) + (await rb.text())).replace(/\s+/g, '');
      var bytes = b64ToU8(B64);
      var ds = new DecompressionStream('gzip');
      var stream = new Blob([bytes]).stream().pipeThrough(ds);
      var html = await new Response(stream).text();
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      var el = document.getElementById('boot');
      if (el) el.textContent = 'Ошибка загрузки: ' + e;
      console.error(e);
    }
  }
  main();
})();
</script>
</body>
</html>
