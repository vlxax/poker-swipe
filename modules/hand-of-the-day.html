<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>PokerSwipe — Рука дня</title>
<style>
html,body{margin:0;height:100%;background:#030504}
iframe{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<iframe id="hd" title="Рука дня" src="../PokerSwipe_DailyHand_STAGE3_1.html"></iframe>
<script>
(function(){
  function postBack(){
    try { if (window.parent && window.parent !== window) window.parent.postMessage({type:'HAND_DAY_BACK'}, '*'); } catch(e){}
  }
  // Escape closes to home
  window.addEventListener('keydown', function(e){
    if (e.key === 'Escape') postBack();
  });
  // After child loads, try to wire its back control if present
  var frame = document.getElementById('hd');
  frame.addEventListener('load', function(){
    try {
      var doc = frame.contentDocument;
      if (!doc) return;
      var btn = doc.getElementById('backBtn') || doc.querySelector('.back, [data-back], button.back');
      if (btn && !btn.dataset.psParentWired) {
        btn.dataset.psParentWired = '1';
        btn.addEventListener('click', function(ev){
          // If already on intro-like screen, exit to app
          var intro = doc.getElementById('introScreen');
          if (!intro || intro.classList.contains('active') || intro.style.display !== 'none') {
            postBack();
          }
        }, true);
      }
    } catch (e) { console.warn('hand-day wire', e); }
  });
})();
</script>
</body>
</html>
