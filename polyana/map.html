<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Карта клубов Москвы</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0f0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#map{position:relative;width:100%;height:100%;overflow:hidden;background:#0d0f0d;touch-action:none;cursor:grab;isolation:isolate}#map.dragging{cursor:grabbing}
.tiles,.markers{position:absolute;inset:0;overflow:hidden}.tile{position:absolute;width:256px;height:256px;max-width:none;user-select:none;-webkit-user-drag:none;filter:brightness(.47) saturate(.74) contrast(1.18) hue-rotate(18deg)}
.markers{pointer-events:none}.marker{position:absolute;left:0;top:0;width:34px;height:34px;border:0;background:transparent;padding:0;pointer-events:auto;z-index:4}.marker span{display:block;width:14px;height:14px;margin:auto;border-radius:50%;background:#c8ff3d;border:3px solid #090b08;box-shadow:0 0 0 1px #c8ff3d,0 0 12px #c8ff3d88}.marker.favorite span{background:#ffd66b;box-shadow:0 0 0 1px #ffd66b,0 0 12px #ffd66b88}
.controls{position:absolute;left:10px;top:10px;z-index:7;display:grid;border:1px solid #34383a;border-radius:11px;overflow:hidden;background:#0d0f0eee;box-shadow:0 4px 18px #0008}.controls button{width:40px;height:40px;border:0;border-bottom:1px solid #34383a;background:#0f110f;color:#c8ff3d;font:900 20px/1 system-ui}.controls button:last-child{border-bottom:0}
.status{position:absolute;left:60px;right:10px;top:10px;z-index:6;background:#090b09e8;border:1px solid #33392d;border-radius:11px;padding:9px 11px;color:#c8c3ca;font-size:11px;line-height:1.3;pointer-events:none}.status b{color:#c8ff3d}
.popup{position:absolute;z-index:9;width:230px;max-width:calc(100% - 16px);padding:12px 32px 11px 12px;border:1px solid #667d25;border-radius:13px;background:#11140ff5;color:#fff;box-shadow:0 10px 30px #000b;pointer-events:auto}.popup b{display:block;color:#c8ff3d;font-size:12px;line-height:1.25;margin-bottom:5px}.popup span{display:block;color:#c8c3ca;font-size:10px;line-height:1.35}.popup .line{margin-top:7px;padding-top:7px;border-top:1px solid #2a2e2a}.popup .go{width:100%;margin-top:8px;min-height:34px;border:1px solid #64791f;border-radius:10px;background:#151b0f;color:#d9ff77;font:900 9px/1 system-ui}.close,.fav{position:absolute;top:5px;width:24px;height:24px;border:0;border-radius:50%;background:#242722;font-size:16px}.close{right:6px;color:#fff}.fav{left:6px;color:#77717a}.fav.on{color:#ffd66b}.popup{padding-left:36px}
.attr{position:absolute;right:4px;bottom:3px;z-index:5;background:#090a09d8;color:#777;font-size:7px;padding:2px 4px;border-radius:4px;pointer-events:none}.error{position:absolute;inset:18px;display:grid;place-items:center;text-align:center;color:#aaa4ad;border:1px dashed #3a3c3a;border-radius:16px;padding:20px;z-index:10;background:#0d0f0de8}
</style>
</head>
<body>
<div id="map"><div class="tiles" aria-hidden="true"></div><div class="markers"></div><div class="popup" hidden></div><div class="controls"><button type="button" data-plus aria-label="Приблизить">+</button><button type="button" data-minus aria-label="Отдалить">−</button></div><div class="status" id="status">Открываем карту…</div><div class="attr">© OpenStreetMap contributors</div></div>
<script>
(()=>{'use strict';
const MOSCOW=[55.7558,37.6173],BOUNDS={minLat:54.9,maxLat:56.3,minLng:36.65,maxLng:39.05},MIN_Z=8,MAX_Z=17,FAV_KEY='psp-polyana-favorite-clubs-v1',GEO_CACHE='psp-polyana-geocode-v8',CHANNEL='psp-polyana-map-v8';
const el=document.getElementById('map'),tiles=el.querySelector('.tiles'),markers=el.querySelector('.markers'),popup=el.querySelector('.popup'),status=document.getElementById('status');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),valid=(a,b)=>Number.isFinite(a)&&Number.isFinite(b)&&a>=BOUNDS.minLat&&a<=BOUNDS.maxLat&&b>=BOUNDS.minLng&&b<=BOUNDS.maxLng,esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
let center=[...MOSCOW],zoom=10,raf=0,drag=null,pinch=null,activePopupId='',events=[],favs=readFavs();const coords=new Map(),markerEls=new Map(),tileEls=new Map(),pointers=new Map();
function readFavs(){try{const a=JSON.parse(localStorage.getItem(FAV_KEY)||'[]');return new Set(Array.isArray(a)?a.map(norm):[])}catch(_){return new Set()}}function saveFavs(){try{localStorage.setItem(FAV_KEY,JSON.stringify([...favs]))}catch(_){}}
function project(lat,lng,z){const n=256*2**z,s=Math.sin(clamp(lat,-85.0511,85.0511)*Math.PI/180);return{x:(lng+180)/360*n,y:(.5-Math.log((1+s)/(1-s))/(4*Math.PI))*n}}function unproject(x,y,z){const n=256*2**z;return[180/Math.PI*Math.atan(Math.sinh(Math.PI*(1-2*y/n))),x/n*360-180]}function topLeft(){const p=project(center[0],center[1],zoom);return{x:p.x-el.clientWidth/2,y:p.y-el.clientHeight/2}}
function popupPosition(){if(popup.hidden||!activePopupId)return;const r=coords.get(activePopupId);if(!r)return;const w=el.clientWidth||390,h=el.clientHeight||560,tl=topLeft(),p=project(r.lat,r.lng,zoom),x=p.x-tl.x,y=p.y-tl.y;popup.style.left=Math.max(8,Math.min(w-242,x+12))+'px';popup.style.top=Math.max(8,Math.min(h-150,y-30))+'px'}
function render(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const w=el.clientWidth||390,h=el.clientHeight||560,tl=topLeft(),ts=256,max=2**zoom,wanted=new Set();for(let ty=Math.floor(tl.y/ts)-1;ty<=Math.floor((tl.y+h)/ts)+1;ty++)for(let tx=Math.floor(tl.x/ts)-1;tx<=Math.floor((tl.x+w)/ts)+1;tx++){if(ty<0||ty>=max)continue;const wrap=((tx%max)+max)%max,key=`${zoom}/${wrap}/${ty}/${tx}`;wanted.add(key);let img=tileEls.get(key);if(!img){img=document.createElement('img');img.className='tile';img.alt='';img.draggable=false;img.src=`https://tile.openstreetmap.org/${zoom}/${wrap}/${ty}.png`;tileEls.set(key,img);tiles.appendChild(img)}img.style.left=(tx*ts-tl.x)+'px';img.style.top=(ty*ts-tl.y)+'px'}for(const[k,img]of tileEls)if(!wanted.has(k)){img.remove();tileEls.delete(k)}for(const[id,m]of markerEls){const r=coords.get(id),p=project(r.lat,r.lng,zoom),x=p.x-tl.x,y=p.y-tl.y;m.style.transform=`translate(${Math.round(x)}px,${Math.round(y)}px) translate(-50%,-50%)`;m.hidden=x<-35||y<-35||x>w+35||y>h+35}popupPosition()})}
function clubEvent(c){const n=norm(c.name);return events.filter(e=>{const x=norm(e.club);return x&&n&&(x.includes(n)||n.includes(x))}).sort((a,b)=>`${a.date||''}T${a.time||''}`.localeCompare(`${b.date||''}T${b.time||''}`))[0]||null}
function popupHtml(r){const c=r.c,k=norm(c.name),fav=favs.has(k),ev=clubEvent(c);return `<button type="button" class="fav ${fav?'on':''}" data-fav aria-label="Избранное">${fav?'★':'☆'}</button><button type="button" class="close" data-close aria-label="Закрыть">×</button><b>${esc(c.name||'Клуб')}</b><span>${esc(c.address||'Адрес уточняется')}</span>${c.metro?`<span>м. ${esc(c.metro)}</span>`:''}${c.working_hours?`<span>${esc(c.working_hours)}</span>`:''}<span class="line">${ev?`Ближайшее: ${esc(ev.time||'')} · ${esc(ev.tournament||'Турнир клуба')}`:'Ближайший турнир не найден'}</span><button type="button" class="go" data-go>Турниры клуба →</button>`}
function openPopup(id){const r=coords.get(id);if(!r)return;activePopupId=id;popup.hidden=false;popup.innerHTML=popupHtml(r);popup.querySelector('[data-close]').onclick=e=>{e.stopPropagation();closePopup()};popup.querySelector('[data-fav]').onclick=e=>{e.stopPropagation();const k=norm(r.c.name);favs.has(k)?favs.delete(k):favs.add(k);saveFavs();markerEls.get(id)?.classList.toggle('favorite',favs.has(k));openPopup(id)};popup.querySelector('[data-go]').onclick=e=>{e.stopPropagation();try{parent.postMessage({type:'psp-map-open-club',club:r.c.name||''},location.origin)}catch(_){}};popupPosition()}
function closePopup(){activePopupId='';popup.hidden=true}
function add(c,lat,lng){if(!valid(+lat,+lng))return false;const id=String(c.id||c.source_id||c.name||'');if(!id||coords.has(id))return false;coords.set(id,{c,lat:+lat,lng:+lng});const m=document.createElement('button');m.type='button';m.className='marker'+(favs.has(norm(c.name))?' favorite':'');m.title=c.name||'Клуб';m.innerHTML='<span></span>';m.onclick=e=>{e.stopPropagation();openPopup(id)};markerEls.set(id,m);markers.appendChild(m);return true}
function fitAll(){const a=[...coords.values()];if(!a.length){center=[...MOSCOW];zoom=10;render();return}let minLat=Infinity,maxLat=-Infinity,minLng=Infinity,maxLng=-Infinity;for(const p of a){minLat=Math.min(minLat,p.lat);maxLat=Math.max(maxLat,p.lat);minLng=Math.min(minLng,p.lng);maxLng=Math.max(maxLng,p.lng)}center=[(minLat+maxLat)/2,(minLng+maxLng)/2];const w=Math.max(250,el.clientWidth-54),h=Math.max(300,el.clientHeight-96);let chosen=MIN_Z;for(let z=MAX_Z;z>=MIN_Z;z--){const p1=project(maxLat,minLng,z),p2=project(minLat,maxLng,z);if(Math.abs(p2.x-p1.x)<=w&&Math.abs(p2.y-p1.y)<=h){chosen=z;break}}zoom=chosen;render()}
function readGeoCache(){try{const x=JSON.parse(localStorage.getItem(GEO_CACHE)||'{}');return x&&typeof x==='object'?x:{}}catch(_){return{}}}
function writeGeoCache(cache){try{localStorage.setItem(GEO_CACHE,JSON.stringify(cache))}catch(_){}}
function clubKey(c){return String(c.id||c.source_id||c.name||'').trim()}
function validResult(lat,lng){return valid(Number(lat),Number(lng))}
async function fetchTimeout(url,ms=7000){
  const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),ms);
  try{
    const r=await fetch(url,{cache:'no-store',signal:ctl.signal,headers:{'Accept':'application/json'}});
    if(!r.ok)throw Error(r.status);
    return await r.json();
  }finally{clearTimeout(timer)}
}
async function geocodeAddress(address){
  const q=encodeURIComponent(`${address}, Москва, Россия`);
  try{
    const d=await fetchTimeout(`https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=json&countryCode=RUS&maxLocations=1&outFields=Match_addr,Addr_type&SingleLine=${q}`,6500);
    const c=d?.candidates?.[0],lat=Number(c?.location?.y),lng=Number(c?.location?.x);
    if(validResult(lat,lng))return [lat,lng];
  }catch(_){}
  try{
    const d=await fetchTimeout(`https://photon.komoot.io/api/?limit=1&lang=ru&q=${q}`,6500);
    const f=d?.features?.[0],lng=Number(f?.geometry?.coordinates?.[0]),lat=Number(f?.geometry?.coordinates?.[1]);
    if(validResult(lat,lng))return [lat,lng];
  }catch(_){}
  return null;
}
async function pool(items,limit,worker){
  let next=0;
  const runners=Array.from({length:Math.min(limit,items.length)},async()=>{for(;;){const i=next++;if(i>=items.length)return;await worker(items[i],i)}});
  await Promise.all(runners);
}
async function json(url){const r=await fetch(url+(url.includes('?')?'&':'?')+'v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}

const bc=typeof BroadcastChannel==='function'?new BroadcastChannel(CHANNEL):null;
bc?.addEventListener('message',e=>{
  const x=e.data;
  if(!x||x.type!=='coord'||!x.club||!validResult(x.lat,x.lng))return;
  if(add(x.club,x.lat,x.lng)){render();updateStatus(window.__pspMapTotal||coords.size)}
});
window.addEventListener('storage',e=>{
  if(e.key!==GEO_CACHE||!e.newValue)return;
  try{
    const c=JSON.parse(e.newValue)||{};
    for(const [id,p] of Object.entries(c)){
      const club=(window.__pspSourceClubs||[]).find(x=>clubKey(x)===id);
      if(club&&Array.isArray(p)&&validResult(p[0],p[1]))add(club,p[0],p[1]);
    }
    render();updateStatus(window.__pspMapTotal||coords.size);
  }catch(_){}
});
function updateStatus(total){
  const shown=coords.size,missing=Math.max(0,total-shown);
  status.innerHTML=missing?`На карте <b>${shown}</b> из ${total} · добавляем точки…`:`На карте <b>${shown}</b> клубов`;
}
async function load(){
  try{
    const [d,source,ev]=await Promise.all([
      json('club_coords.json').catch(()=>({clubs:[]})),
      json('../data/moscow_club_locations_source.json'),
      json('../data/moscow_schedule_today.json').catch(()=>({events:[]}))
    ]);
    events=Array.isArray(ev.events)?ev.events:[];
    const sourceClubs=Array.isArray(source.clubs)?source.clubs:[];
    window.__pspSourceClubs=sourceClubs;
    window.__pspMapTotal=sourceClubs.length||Number(d.club_count)||0;

    const byId=new Map(sourceClubs.map(c=>[clubKey(c),c]));
    for(const c of (Array.isArray(d.clubs)?d.clubs:[])){
      const full=byId.get(String(c.source_id||c.id||c.name||''))||c;
      add({...full,...c},c.lat,c.lng);
    }

    const cache=readGeoCache();
    for(const c of sourceClubs){
      const p=cache[clubKey(c)];
      if(Array.isArray(p)&&validResult(p[0],p[1]))add(c,p[0],p[1]);
    }

    if(coords.size)fitAll(); else render();
    updateStatus(window.__pspMapTotal);

    const todo=sourceClubs.filter(c=>!coords.has(clubKey(c))&&c.address);
    if(!todo.length)return;

    await pool(todo,6,async c=>{
      const id=clubKey(c);
      if(coords.has(id))return;
      const p=await geocodeAddress(c.address);
      if(!p)return;
      cache[id]=p;writeGeoCache(cache);
      const added=add(c,p[0],p[1]);
      if(added){
        bc?.postMessage({type:'coord',club:c,lat:p[0],lng:p[1]});
        render();updateStatus(window.__pspMapTotal);
      }
    });

    if(coords.size)fitAll();
    updateStatus(window.__pspMapTotal);
  }catch(_){
    status.textContent='Карта временно недоступна';
  }
}
function zoomBy(delta){const z=clamp(zoom+delta,MIN_Z,MAX_Z);if(z!==zoom){zoom=z;render()}}
el.querySelector('[data-plus]').onclick=e=>{e.stopPropagation();zoomBy(1)};el.querySelector('[data-minus]').onclick=e=>{e.stopPropagation();zoomBy(-1)};
el.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});el.setPointerCapture?.(e.pointerId);closePopup();if(pointers.size===1){drag={id:e.pointerId,x:e.clientX,y:e.clientY,p:project(center[0],center[1],zoom)};el.classList.add('dragging')}else if(pointers.size===2){drag=null;el.classList.remove('dragging');const p=[...pointers.values()];pinch={dist:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),zoom}}});
el.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pinch&&pointers.size>=2){const p=[...pointers.values()],dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),z=clamp(Math.round(pinch.zoom+Math.log2(Math.max(.2,dist/pinch.dist))),MIN_Z,MAX_Z);if(z!==zoom){zoom=z;render()}return}if(drag&&drag.id===e.pointerId){const p={x:drag.p.x-(e.clientX-drag.x),y:drag.p.y-(e.clientY-drag.y)},c=unproject(p.x,p.y,zoom);center=[clamp(c[0],BOUNDS.minLat,BOUNDS.maxLat),clamp(c[1],BOUNDS.minLng,BOUNDS.maxLng)];render()}});
function endPointer(e){pointers.delete(e.pointerId);if(drag?.id===e.pointerId){drag=null;el.classList.remove('dragging')}if(pointers.size<2)pinch=null;try{el.releasePointerCapture?.(e.pointerId)}catch(_){}}
el.addEventListener('pointerup',endPointer);el.addEventListener('pointercancel',endPointer);el.addEventListener('lostpointercapture',e=>{if(pointers.has(e.pointerId))endPointer(e)});el.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1:-1)},{passive:false});window.addEventListener('resize',render);window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='psp-map-reset')fitAll()});render();load();
})();
</script>
</body></html>
