<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080c">
<title>POKER SWIPE — V15 REG CORRECTIONS</title>
<style>
:root{
  --bg:#08080c;--panel:#121219;--panel2:#17171f;--line:#30303a;--text:#faf8fa;
  --mut:#98939f;--pink:#ff2e84;--pink2:#ff6aac;--g:#42e786;--y:#ffd257;--r:#ff4b68;
  --safe:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}
body{min-height:100vh}.app{max-width:480px;margin:0 auto;min-height:100vh;background:
radial-gradient(circle at 55% -10%,#ff2e841d,transparent 34%),var(--bg);position:relative}
button,input{font:inherit}button{color:inherit}.hidden{display:none!important}
.screen{display:none;padding:10px 0 calc(95px + var(--safe))}.screen.active{display:block}
.top{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;
background:linear-gradient(#08080cf4,#08080ccb,transparent);backdrop-filter:blur(10px)}
.brand{font-weight:950;letter-spacing:-.04em}.pink{color:var(--pink)}.green{color:var(--g)}.yellow{color:var(--y)}.red{color:var(--r)}
.mut{color:var(--mut)}.small{font-size:12px}.ey{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);font-weight:900}
.chip{border:1px solid var(--line);background:#121217;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900}
.impact{font-weight:1000;letter-spacing:-.06em;text-transform:uppercase}
h1,h2,h3,p{margin-top:0}h1{font-size:38px;line-height:.88}h2{letter-spacing:-.04em}
.hero,.panel,.lab{margin:0 14px 12px;border:1px solid var(--line);border-radius:26px;padding:18px;background:
radial-gradient(circle at 80% 0,#ff2e8418,transparent 34%),linear-gradient(160deg,#18181f,#0e0e13)}
.section{padding:0 14px;margin-top:16px}.section h3{font-size:12px;letter-spacing:.11em;color:#c3bec8}
.primary,.secondary,.choice,.action{
width:100%;border:0;border-radius:16px;padding:14px 14px;font-weight:950;margin-top:8px}
.primary{background:var(--pink);color:white;box-shadow:0 10px 28px #ff2e8428}
.secondary{background:#15151c;border:1px solid #373741}.choice{background:#121219;border:1px solid #363640}
.choice.selected{border-color:var(--pink);box-shadow:0 0 20px #ff2e842b}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:0 14px}
.tile{min-height:154px;border:1px solid var(--line);border-radius:23px;background:#15151b;padding:15px;text-align:left;position:relative;overflow:hidden}
.tile b{display:block;font-size:18px;line-height:1}.tile .go{position:absolute;right:13px;bottom:12px;color:var(--pink);font-weight:950}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:0 14px 11px}
.metric{background:#101015;border:1px solid #2c2c35;border-radius:18px;padding:11px;text-align:left}
.metric b{display:block;font-size:24px;margin:4px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #25252d;padding:11px 0}
.bar{height:8px;background:#25252d;border-radius:99px;overflow:hidden}.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--pink2))}
.nav{position:fixed;z-index:50;left:50%;bottom:0;transform:translateX(-50%);width:min(480px,100%);display:grid;grid-template-columns:repeat(4,1fr);
padding:9px 8px calc(9px + var(--safe));background:#0b0b0ff5;border-top:1px solid #26262d;backdrop-filter:blur(14px)}
.nav button{border:0;background:transparent;color:#6f6a75;font-size:10px;font-weight:900;padding:8px 3px}.nav button i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}
.nav button.on{color:#fff}.nav button.on i{color:var(--pink)}
.cards{display:flex;gap:7px;justify-content:center;margin:14px 0}.pc{width:50px;height:69px;border-radius:10px;background:#f6f6f7;color:#111;display:grid;place-items:center;font-size:20px;font-weight:1000;box-shadow:0 8px 20px #0007}
.suit-red{color:#d91536}
.actions{position:sticky;bottom:76px;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 14px;background:linear-gradient(transparent,#08080cf5 28%)}
.action{margin:0;padding:15px 6px;background:#15151b;border:1px solid #3a3a45}.action.fold{border-color:#ff4b6855}.action.call{border-color:#ffd25755}.action.raise{border-color:#42e78655}
.verdict{margin:10px 14px;border:1px solid #383843;border-radius:20px;padding:15px;background:#101015}
.onboard{min-height:100vh;display:grid;place-items:center;padding:26px}.story{width:100%;border:2px solid #09090d;border-radius:30px;padding:25px;background:
radial-gradient(circle at 80% 20%,#ff2e8429,transparent 32%),linear-gradient(150deg,#f5eff3,#e8dfe5);color:#111;box-shadow:0 22px 80px #0008}
.story h1{font-size:44px}.story input{width:100%;border:2px solid #111;border-radius:16px;background:white;padding:14px;font-size:18px;margin:10px 0}
.story .primary{border:2px solid #111}.tap{margin-top:14px;font-weight:900;color:#5d5058}
.build{position:fixed;right:8px;top:8px;z-index:999;background:var(--pink);border:2px solid #08080c;border-radius:999px;padding:6px 8px;font-size:9px;font-weight:950}

/* HOME DISTINCT MODES */
.dailyTile{grid-column:1/-1;min-height:210px;background:radial-gradient(circle at 70% 35%,#1d4631,#101714 46%,#121218 78%)}
.dailyBoard{display:flex;gap:4px;margin-top:16px}.dailyBoard span{width:37px;height:51px;background:#f5f5f6;color:#111;border-radius:8px;display:grid;place-items:center;font-weight:950}
.sizingTile{background:radial-gradient(circle at 85% 10%,#ff2e8430,transparent 34%),#15151b}.chipsPreview{height:47px;display:flex;gap:1px;align-items:flex-end;margin-top:10px}.chipsPreview i{width:30px;height:8px;border:2px solid var(--pink);border-radius:50%;background:#25131c;margin-right:-12px}
.csiPreview{border-left:2px solid #484852;padding-left:11px;margin-top:11px;font-size:9px;line-height:15px}.xrayTile{background:radial-gradient(circle at 40% 40%,#6b214938,transparent 42%),#15151b}
.miniGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:105px;margin-top:10px}.miniGrid i{aspect-ratio:1;border-radius:2px;background:#51213b}.miniGrid i:nth-child(4n){opacity:.24}
.quick5{margin:10px 14px;border:1px solid #393943;border-radius:20px;background:#111116;padding:14px;display:flex;justify-content:space-between;text-align:left;width:calc(100% - 28px)}.quick5 strong{font-size:25px}

/* SIZING */
.table{height:185px;border:8px solid #141419;border-radius:50%;background:radial-gradient(ellipse,#173124,#0d1611 68%);position:relative;margin:14px 0;box-shadow:inset 0 0 35px #000}
.pot{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center}.pot b{font-size:30px;display:block}
.stack{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;align-items:end;height:55px}.stack i{width:31px;height:8px;border:2px solid var(--pink);background:#27131d;border-radius:50%;margin-left:-16px}
.range{width:100%;accent-color:var(--pink)}.scale{display:flex;justify-content:space-between;color:var(--mut);font-size:9px}.sizeRead{display:flex;justify-content:space-between;align-items:end}.sizeRead b{font-size:36px}

/* REVIEW */
.timeline{position:relative;padding-left:31px}.timeline:before{content:"";position:absolute;left:12px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--g),var(--y),var(--r))}
.node{position:relative;width:100%;text-align:left;border:1px solid #31313b;background:#0f0f14;border-radius:16px;padding:11px;margin:8px 0}
.node:before{content:"";position:absolute;left:-25px;top:17px;width:11px;height:11px;border-radius:50%;background:#76717b;border:3px solid #111}
.node.selected{border-color:var(--pink);transform:translateX(5px);box-shadow:0 0 22px #ff2e8427}.node.good{border-color:#42e78666}.node.warn{border-color:#ffd25766}.node.bad{border-color:#ff4b6888}
.evidence{display:grid;grid-template-columns:1fr 1fr;gap:7px}.evidence button{border:1px solid #33333d;background:#111116;border-radius:15px;padding:12px;text-align:left}

/* DAILY */
.dailyStage{min-height:430px;background:radial-gradient(circle at 50% 42%,#173226,#0c1511 34%,#0a0a0e 70%)}.streetDots{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}
.streetDots span{border:1px solid #2e2e38;border-radius:999px;text-align:center;padding:7px;font-size:9px;color:#68636d}.streetDots span.on{color:#fff;border-color:var(--pink)}.streetDots span.done{color:var(--g)}
.argBoard{display:grid;grid-template-columns:1fr 1fr;gap:10px}.drop{min-height:150px;border:1px dashed #464650;border-radius:20px;padding:10px}.token{display:inline-block;border:1px solid #3c3c46;background:#17171d;border-radius:11px;padding:9px;margin:4px;font-size:11px;font-weight:900}

/* HEAL */
.healMap{margin-top:10px}.healStep{display:grid;grid-template-columns:46px 1fr 42px;gap:9px;align-items:center;padding:12px 0;position:relative}.orb{width:44px;height:44px;border:1px solid #464651;border-radius:50%;display:grid;place-items:center;font-weight:950}.healStep.done .orb{border-color:var(--g);box-shadow:0 0 16px #42e78633}
.sortGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bucket{min-height:160px;border:1px dashed #44444e;border-radius:18px;padding:10px}.bucket.value{border-color:#42e78666}.bucket.bluff{border-color:#ff4b6866}

/* MY HANDS */
.pokerDesk{height:225px;border:8px solid #16161c;border-radius:48%;background:radial-gradient(ellipse,#173124,#0c1510 68%);position:relative;margin:15px 0}.seat{position:absolute;border:1px solid #3b3b46;border-radius:999px;background:#101015;padding:7px 9px;font-size:9px;font-weight:950}.seat.on{border-color:var(--pink);box-shadow:0 0 18px #ff2e8433}.seat:nth-child(1){left:50%;top:-13px;transform:translateX(-50%)}.seat:nth-child(2){right:-9px;top:52px}.seat:nth-child(3){right:15px;bottom:-10px}.seat:nth-child(4){left:15px;bottom:-10px}.seat:nth-child(5){left:-9px;top:52px}.seat:nth-child(6){left:50%;bottom:15px;transform:translateX(-50%)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.formgrid input,.formgrid select{width:100%;background:#111116;color:white;border:1px solid #363640;border-radius:13px;padding:11px}
.handTimeline{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.streetBox{background:#101015;border:1px solid #303039;border-radius:15px;padding:10px}.streetBox .potbar{width:100%;background:var(--pink);border-radius:99px;margin-top:8px}

/* XRAY */
.xrStage{margin:0 14px 12px;border:1px solid #34343f;border-radius:30px;padding:18px;background:
radial-gradient(circle at 55% 18%,#ff2e8421,transparent 34%),radial-gradient(circle at 50% 62%,#45ffbc0d,transparent 42%),linear-gradient(165deg,#17171e,#09090d 75%);position:relative;overflow:hidden}
.xrStage:before{content:"";position:absolute;left:-20%;right:-20%;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--pink),white,var(--pink),transparent);box-shadow:0 0 18px var(--pink);animation:scan 4s ease-in-out infinite}@keyframes scan{50%{transform:translateY(520px);opacity:.45}}
.xrGrid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:3px;user-select:none;touch-action:none}.xrCell{aspect-ratio:1;border:1px solid #2b2b35;background:#101015;border-radius:4px;color:#7d7781;font-size:6px;font-weight:950;padding:0}.xrCell.alive{background:#25131c;border-color:#70304e;color:#ffe7f1}.xrCell.keep{background:#632342;border-color:var(--pink);color:#fff;box-shadow:0 0 8px #ff2e8437}.xrCell.dead{opacity:.1;pointer-events:none}
.xrProg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:11px 0}.xrProg span{border:1px solid #2e2e37;border-radius:999px;padding:7px 3px;text-align:center;font-size:8px;color:#66616b}.xrProg .on{border-color:var(--pink);color:#fff}.xrProg .done{border-color:#42e78655;color:var(--g)}
.funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.funnel div{border:1px solid #303039;border-radius:14px;background:#0f0f14;padding:9px;text-align:center}.funnel b{font-size:21px;display:block}
.balance{display:grid;grid-template-columns:1fr 1fr;gap:9px}.col{min-height:155px;border:1px solid #303039;border-radius:18px;padding:11px}.col.v{border-color:#42e78655}.col.b{border-color:#ff4b6855}
.shareCard{background:linear-gradient(145deg,#28121d,#111116);border:1px solid #5c2941;border-radius:22px;padding:17px;text-align:center}.shareCard .big{font-size:37px;font-weight:1000}

/* YOU */
.dna{height:285px;position:relative;border:1px solid #292933;border-radius:28px;background:radial-gradient(circle,#191922,#0d0d12 70%);margin:12px 0}.dnaCore{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;border:1px solid var(--pink);background:#171219;display:grid;place-items:center;text-align:center;box-shadow:0 0 34px #ff2e8427}.skillNode{position:absolute;width:84px;height:84px;border-radius:50%;border:1px solid #383842;background:#101015;font-size:9px;font-weight:950}.skillNode b{display:block;font-size:21px}.skillNode.n1{left:15px;top:22px}.skillNode.n2{right:15px;top:22px}.skillNode.n3{left:15px;bottom:22px}.skillNode.n4{right:15px;bottom:22px}.skillNode.leak{border-color:var(--r);box-shadow:0 0 23px #ff4b6835}
.scrub{width:100%;accent-color:var(--pink)}
.modal{position:fixed;z-index:100;inset:0;background:#000a;display:grid;align-items:end}.sheet{max-width:480px;width:100%;margin:auto;background:#111116;border:1px solid #34343e;border-radius:28px 28px 0 0;padding:18px 16px 30px}.close{float:right;border:0;background:#22222a;color:white;border-radius:50%;width:34px;height:34px}
@media(max-width:380px){h1{font-size:33px}.xrCell{font-size:5px}.pc{width:44px;height:62px}}

/* ===== V14.4 SWIPE UX ===== */
.swipeShell{margin:0 14px 12px;position:relative}
.swipeTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.swipeProgress{height:5px;background:#24242d;border-radius:99px;overflow:hidden;margin:0 0 10px}.swipeProgress span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--pink2));transition:width .25s}
.swipeCardV{border:1px solid var(--line);border-radius:27px;padding:18px;background:radial-gradient(circle at 78% 6%,#ff2e841b,transparent 35%),linear-gradient(160deg,#18181f,#0e0e13);transition:transform .24s,opacity .24s;min-height:330px}
.swipeCardV.out{transform:translateX(-24px) rotate(-1deg);opacity:0}.swipeCardV.in{animation:swIn .25s ease-out}@keyframes swIn{from{transform:translateX(24px);opacity:.1}to{transform:none;opacity:1}}
.swipeContext{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.swipeContext div{border:1px solid #2f2f38;background:#101015;border-radius:13px;padding:9px}.swipeContext b{display:block;font-size:13px}
.swipeThink{font-variant-numeric:tabular-nums}.swipeHint{margin:9px 0 0;color:var(--mut);font-size:11px}
.action{position:relative;transition:transform .13s,border-color .13s,background .13s,box-shadow .13s,opacity .13s}.action:active{transform:scale(.97)}
.action.selected{transform:translateY(-3px);color:white!important;opacity:1!important}.action.selected:not(.grade-g):not(.grade-y):not(.grade-r){border-color:var(--pink);box-shadow:0 0 0 2px #ff2e8430,0 0 22px #ff2e8428;background:#25131c}.action.selected.grade-g{background:#143623;border-color:var(--g);box-shadow:0 0 0 2px #42e78638,0 0 26px #42e78633}.action.selected.grade-y{background:#382e12;border-color:var(--y);box-shadow:0 0 0 2px #ffd25730,0 0 26px #ffd25722}.action.selected.grade-r{background:#3c1720;border-color:var(--r);box-shadow:0 0 0 2px #ff4b6835,0 0 26px #ff4b6828}.action:disabled:not(.selected){opacity:.32}
.swipeFlash{margin:10px 0 0;border-radius:17px;padding:12px;border:1px solid #34343e;background:#0e0e13}.swipeFlash h3{margin:3px 0 6px}.swipeReport{margin:0 14px;border:1px solid #393944;border-radius:28px;padding:20px;background:radial-gradient(circle at 70% 10%,#ff2e8422,transparent 34%),#111116}.swipeReportGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:13px 0}.swipeReportGrid div{border:1px solid #303039;border-radius:15px;padding:11px;text-align:center}.swipeReportGrid b{display:block;font-size:24px}
.xrChoiceBar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:10px 0}.xrCountLive{font-size:28px;font-weight:1000}.xrRule{border-left:3px solid var(--pink);padding-left:10px;margin:11px 0}.xrCell.removed{opacity:.12!important;transform:scale(.88)}

/* ===== V15 REG CORRECTIONS ===== */
.dnaNav{width:24px;height:22px;position:relative;margin:0 auto 3px!important;display:block!important}.dnaNav b,.dnaNav span{position:absolute;border-radius:50%;display:block}.dnaNav b{width:7px;height:7px;left:8.5px;top:7.5px;background:currentColor;box-shadow:0 0 12px currentColor}.dnaNav span{width:4px;height:4px;background:currentColor;opacity:.7}.dnaNav span:nth-child(1){left:10px;top:0}.dnaNav span:nth-child(2){right:1px;top:9px}.dnaNav span:nth-child(3){left:10px;bottom:0}.dnaNav span:nth-child(4){left:1px;top:9px}.nav button.on .dnaNav:after{content:"";position:absolute;left:2px;right:2px;top:10px;height:1px;background:currentColor;box-shadow:0 -7px 0 -0.5px currentColor,0 7px 0 -0.5px currentColor;opacity:.45}
.nav button.hasLeak .dnaNav span:nth-child(2){background:var(--r);opacity:1;box-shadow:0 0 9px var(--r)}
.sampleTag{display:inline-flex;border:1px solid #373741;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:950;color:var(--mut)}
.swipeSizeDrawer{margin:10px 14px 0;border:1px solid #383843;border-radius:22px;padding:15px;background:#101015;box-shadow:0 20px 50px #0008;animation:drawerIn .18s ease-out}@keyframes drawerIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.dualGrade{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:9px 0}.gradeBox{border:1px solid #33333e;border-radius:15px;padding:11px;background:#0d0d12}.gradeBox b{display:block;font-size:18px;margin-top:3px}.gradeBox.g{border-color:#42e78666}.gradeBox.y{border-color:#ffd25766}.gradeBox.r{border-color:#ff4b6877}
.holdBadge{display:inline-flex;border:1px solid #4a3b45;border-radius:999px;padding:5px 8px;color:var(--pink);font-size:9px;font-weight:950;margin-bottom:6px}.swipeFlash{cursor:pointer}
.argTray{min-height:92px;border:1px solid #303039;border-radius:20px;padding:10px;background:#0f0f14;margin:10px 0}.argToken{touch-action:none;user-select:none;cursor:grab;display:inline-flex;align-items:center;border:1px solid #444450;background:#18181f;border-radius:12px;padding:10px;margin:4px;font-size:11px;font-weight:900;transition:transform .12s,border-color .12s,opacity .12s}.argToken.dragging{opacity:.3}.argGhost{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%) rotate(-2deg);border:1px solid var(--pink);border-radius:12px;padding:10px;background:#24131c;box-shadow:0 14px 40px #000b;font-size:11px;font-weight:950;max-width:180px}.drop.hot{border-color:var(--pink);background:#1c1017;box-shadow:0 0 20px #ff2e8426}.drop .argToken{display:block;margin:6px 0}.argCounter{text-align:center;color:var(--mut);font-size:10px;font-weight:900;margin:6px 0}.disabledBtn{opacity:.35;pointer-events:none}
.dailyPot{display:flex;justify-content:center;gap:24px;margin:8px 0}.dailyPot div{text-align:center}.dailyPot b{display:block;font-size:24px}
.quickBanner{margin:0 14px 10px;border:1px solid #67314c;border-radius:18px;padding:11px;background:#1b1017;display:flex;justify-content:space-between;align-items:center}.quickBanner b{font-size:11px}.quickDots{display:flex;gap:5px}.quickDots i{width:8px;height:8px;border-radius:50%;background:#34343d}.quickDots i.done{background:var(--g)}.quickDots i.on{background:var(--pink);box-shadow:0 0 10px var(--pink)}
.reviewNone{border:1px dashed #4a4a55!important;background:#111116!important}.reviewNone.selected{border-color:var(--pink)!important;background:#25131c!important}.repairSlider{margin:12px 0}
.goalPills{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.goalPill{border:1px solid #34343f;border-radius:999px;background:#111116;padding:8px 10px;font-size:10px;font-weight:900}.goalPill.on{border-color:var(--pink);background:#25131c}
.healHero{border:1px solid #533047;border-radius:23px;padding:16px;background:radial-gradient(circle at 90% 0,#ff2e8423,transparent 33%),#111116;margin-bottom:12px}.healHero h2{margin-bottom:5px}.healEvidence{border-left:2px solid var(--r);padding-left:10px;margin:10px 0}.healCourseNav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.healCourseNav div{border:1px solid #303039;border-radius:13px;padding:9px 5px;text-align:center;font-size:8px;color:var(--mut)}.healCourseNav div.done{border-color:#42e78666;color:var(--g)}.healCourseNav div.on{border-color:var(--pink);color:#fff;background:#21121a}

function xrReveal(score){const s=XR[xrI],ref=new Set(s.ref[xrStage]),dead=xrDead(xrStage,false),extra=[...xrCurrent].filter(k=>!ref.has(k)).length,miss=[...ref].filter(k=>!xrCurrent.has(k)).length;$('#xrayArea').innerHTML=`<div class="xrStage"><span class="ey">СРАВНЕНИЕ</span><h1 class="impact">${score>=80?'ПОХОЖЕ.<br><span class="pink">ДАЛЬШЕ.</span>':'RANGE<br><span class="pink">ПЛЫВЁТ.</span>'}</h1><div class="grid2"><div class="lab"><span class="ey">ЛИШНИЕ КЛАССЫ</span><h2>${extra}</h2></div><div class="lab"><span class="ey">УБИЛ РАНО</span><h2>${miss}</h2></div></div><div class="verdict"><h2>WEIGHTED SCORE ${score}</h2><p>Классы взвешены реальным количеством доступных combos после board removal.</p></div><button class="primary" id="xrNext">${xrStage<3?'СЛЕДУЮЩАЯ УЛИЦА':'VALUE / BLUFF'} →</button></div>`;$('#xrNext').onclick=()=>{if(xrStage<3){xrStage++;xrCandidate=new Set(xrCurrent);renderXrayStage()}else xrRiver()}}
function xrRiver(){const s=XR[xrI],available=s.river.filter(([k])=>xrCurrent.has(k));xrClass={};function rr(){const done=Object.keys(xrClass).length;$('#xrClassified').textContent=`РАЗОБРАНО ${done}/${available.length}`;$('#xrRiverGo').classList.toggle('disabledBtn',done!==available.length);$$('[data-xt]').forEach(b=>{b.classList.toggle('doneV',xrClass[b.dataset.xt]==='V');b.classList.toggle('doneB',xrClass[b.dataset.xt]==='B')})}$('#xrayArea').innerHTML=`<div class="xrStage"><span class="ey">РИВЕР · VALUE / BLUFF</span><h1 class="impact">РАЗБЕРИ ВСЁ.<br><span class="pink">НЕ ДВЕ УДОБНЫЕ РУКИ.</span></h1>${board(s.board)}<div>${available.map(([k])=>`<button class="token" data-xt="${k}">${k}</button>`).join('')}</div><div class="xrClassified" id="xrClassified"></div><button class="primary disabledBtn" id="xrRiverGo">ВСКРЫТЬ →</button></div>`;$$('[data-xt]').forEach(b=>b.onclick=()=>{const k=b.dataset.xt;xrClass[k]=xrClass[k]==='V'?'B':xrClass[k]==='B'?undefined:'V';if(!xrClass[k])delete xrClass[k];rr()});rr();$('#xrRiverGo').onclick=()=>{if(Object.keys(xrClass).length!==available.length)return;let good=0;for(const [k,v] of available)if(xrClass[k]===v)good++;xrScores.river=Math.round(good/Math.max(1,available.length)*100);xrBlocker()}}
function xrBlocker(){const s=XR[xrI],V=s.river.filter(x=>x[1]==='V').map(x=>x[0]),B=s.river.filter(x=>x[1]==='B').map(x=>x[0]),boardDead=s.board,beforeV=comboCount(V,boardDead),beforeB=comboCount(B,boardDead),afterV=comboCount(V,[...boardDead,...s.hero]),afterB=comboCount(B,[...boardDead,...s.hero]),vRemoved=beforeV-afterV,bRemoved=beforeB-afterB,expected=bRemoved>vRemoved?'bad':'good';$('#xrayArea').innerHTML=`<div class="xrStage"><span class="ey">BLOCKER SCAN · REAL CARD REMOVAL</span><h1 class="impact">ТВОИ КАРТЫ<br><span class="pink">РЕЖУТ RANGE.</span></h1>${hand(s.hero)}<div class="balance"><div class="col v"><span class="ey">VALUE</span><h2>${beforeV} → ${afterV}</h2><p>−${vRemoved}</p></div><div class="col b"><span class="ey">BLUFF</span><h2>${beforeB} → ${afterB}</h2><p>−${bRemoved}</p></div></div><div class="grid2"><button class="choice" data-xb="good">ХОРОШИЙ BLOCKER</button><button class="choice" data-xb="bad">ПЛОХОЙ BLOCKER</button></div></div>`;$$('[data-xb]').forEach(b=>b.onclick=()=>{xrScores.blockers=b.dataset.xb===expected?100:40;xrReport()})}
function xrReport(){const s=XR[xrI],parts=Object.values(xrScores).filter(x=>x>0),score=parts.length?Math.round(parts.reduce((a,b)=>a+b,0)/parts.length):0,n=S.xray.runs;for(const k of ['pre','narrow','river','blockers'])if(xrScores[k])S.xray[k]=Math.round((S.xray[k]*n+xrScores[k])/(n+1));S.xray.runs++;S.xray.best=Math.max(S.xray.best||0,score);S.xray.history.push({date:today(),title:s.title,score});S.xray.history=S.xray.history.slice(-20);recordEvent({mode:'xray',concept:'range narrowing',grade:score>=80?'g':score>=60?'y':'r',action:'full xray'});save();$('#xrayArea').innerHTML=`<div class="xrStage"><span class="ey">RANGE REPORT</span><h1 class="impact">НЕ УГАДЫВАЛ.<br><span class="pink">СУЖАЛ.</span></h1><div class="grid2"><div class="lab"><span class="ey">START RANGE</span><h2>${xrScores.pre||'—'}</h2></div><div class="lab"><span class="ey">NARROWING</span><h2>${xrScores.narrow||'—'}</h2></div><div class="lab"><span class="ey">VALUE / BLUFF</span><h2>${xrScores.river||'—'}</h2></div><div class="lab"><span class="ey">BLOCKERS</span><h2>${xrScores.blockers}</h2></div></div><button class="primary" id="xrAgain">${quick.active?'ЗАКОНЧИТЬ 5 МИНУТ':'ЕЩЁ ОДИН'} →</button></div>`;$('#xrAgain').onclick=()=>quick.active?quickAdvance():xrBegin(0)}

/* YOU */
function categoryStat(test){const a=S.events.filter(test);const n=a.length,score=n?Math.round(a.reduce((z,e)=>z+gradeScore(e.grade),0)/n*100):0;return{n,score}}
function renderProfile(){const pre=categoryStat(e=>/RFI|BB defence|3-bet|flat IP|polar 3-bet/.test(e.concept||'')),post=categoryStat(e=>e.street&&e.street!=='ПРЕФЛОП'&&e.mode!=='sizing'),size=categoryStat(e=>e.mode==='sizing'||e.sizePct!=null),disc={n:S.events.length,score:disciplineScore()};const leak=topLeak(),course=courseForConcept(leak?.concept),xr=S.xray;const conf={cc:0,cu:0,wu:0,wc:0};for(const e of S.events.filter(x=>x.confidence)){if(e.grade==='g'&&e.confidence>=90)conf.cc++;else if(e.grade==='g')conf.cu++;else if(e.confidence>=90)conf.wc++;else conf.wu++}const nodes=[['PREFLOP',pre,'n1'],['POSTFLOP',post,'n2'],['SIZING',size,'n3'],['DISCIPLINE',disc,'n4']];const numeric=nodes.map(x=>x[1].n>=5?x[1].score:101),min=Math.min(...numeric);$('#profileArea').innerHTML=`<div class="panel"><span class="ey">YOU · ${S.nick||'REG'} · POKER DNA</span><h1 class="impact">ДОСЬЕ,<br><span class="pink">НЕ ТАБЕЛЬ.</span></h1><p class="mut">${S.events.length} решений · FORM ${formScore()} · Skill ${S.skill}</p><div class="dna"><div class="dnaCore"><div><span class="ey">SKILL</span><h2>${S.skill}</h2></div></div>${nodes.map((x,i)=>`<button class="skillNode ${x[2]} ${x[1].n>=5&&x[1].score===min?'leak':''}">${x[0]}<b>${sampleText(x[1].n,x[1].score)}</b></button>`).join('')}</div></div>${leak?`<div class="youFocus"><span class="ey">СЕГОДНЯ Я БЫ ЛЕЧИЛА ЭТО</span><h2>${leak.concept}</h2><div class="sampleTag">${leak.r} ошибок / ${leak.n} решений</div><p>Score ${leak.score}. ${leak.events.filter(e=>e.grade==='r'&&e.confidence>=90).length?`Есть уверенные ошибки — это уже blind spot.`:'Нужна ещё проверка на новых картах.'}</p><button class="primary" id="healLeak">ЛЕЧИТЬ · ${COURSE_META[course].title} →</button><h3>ПОЧЕМУ Я ТАК РЕШИЛА</h3>${leak.events.filter(e=>e.grade==='r').slice(-3).reverse().map(e=>`<div class="evidenceRow"><b>${e.spotId||e.mode}</b><div class="mut small">${e.action||''}${e.sizePct?` · ${e.sizePct}%`:''} · ${new Date(e.ts).toLocaleDateString('ru-RU')}</div></div>`).join('')}</div>`:`<div class="youFocus"><span class="ey">СЕГОДНЯ</span><h2>НАБРАТЬ ВЫБОРКУ</h2><p>До 3+ решений на концепт приложение не будет изображать психолога по одной раздаче.</p></div>`}<div class="section"><h3>УВЕРЕННОСТЬ</h3><div class="confidenceGrid"><div><span class="ey">✓ УВЕРЕН</span><b>${conf.cc}</b></div><div><span class="ey">✓ СОМНЕВАЛСЯ</span><b>${conf.cu}</b></div><div><span class="ey">✕ СОМНЕВАЛСЯ</span><b>${conf.wu}</b></div><div style="border-color:#ff4b6866"><span class="ey">✕ УВЕРЕН</span><b class="red">${conf.wc}</b></div></div><h3>◎ RANGE READING</h3><button class="choice" id="youXray">NARROWING <b>${xr.runs?xr.narrow:'—'}</b> · BLOCKERS <b>${xr.runs?xr.blockers:'—'}</b></button><h3>ЧЕМ ГОРДИТЬСЯ</h3>${prideHtml()}</div>`;if($('#healLeak'))$('#healLeak').onclick=()=>{activeCourse=course;show('heal')};$('#youXray').onclick=()=>show('xray')}
function prideHtml(){if(S.snapshots.length<2)return'<p class="mut">Нужно хотя бы два дня данных.</p>';const a=S.snapshots[0],b=S.snapshots.at(-1),d=b.skill-a.skill;return d>0?`<div class="pride"><b>SKILL ${a.skill} → ${b.skill}</b><p>+${d} с начала наблюдений. Маленькая победа, но хотя бы настоящая.</p></div>`:'<p class="mut">Пока устойчивого улучшения не зафиксировано.</p>'}

/* QUICK 5 ORCHESTRATOR */
let quick={active:false,index:0,start:0,flow:['swipe','sizing','memory','review','xray']};let memorySpotId=null;function quickBanner(mode){if(!quick.active)return'';return `<div class="quickBanner"><b>⚡ 5 МИНУТ · ${quick.index+1}/${quick.flow.length}</b><div class="quickDots">${quick.flow.map((x,i)=>`<i class="${i<quick.index?'done':i===quick.index?'on':''}"></i>`).join('')}</div></div>`}
function startQuick(){quick={active:true,index:0,start:now(),flow:['swipe','sizing','memory','review','xray']};memorySpotId=null;newSwipeSession();show('swipe')}
function quickAdvance(){quick.index++;if(quick.index>=quick.flow.length){const sec=Math.round((now()-quick.start)/1000);quick.active=false;openModal(`<span class="ey">5 МИНУТ · ГОТОВО</span><h1>${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}</h1><p>Swipe → Sizing → Memory Check → Review → X-Ray.</p><button class="primary" id="qDone">НА ГЛАВНУЮ</button>`);setTimeout(()=>$('#qDone').onclick=()=>{closeModal();show('home')},0);return}const next=quick.flow[quick.index];if(next==='memory'){const leak=topLeak(),cand=SWIPE.filter(x=>x.concept===leak?.concept);const pick=(cand.length?cand:SWIPE).find(x=>x.id!==memorySpotId)||SWIPE[0];memorySpotId=pick.id;swSession=[pick];swIndex=0;swSessionGrades=[];show('swipe');return}if(next==='review')rv=(rv+1)%REVIEWS.length;if(next==='xray'){show('xray');setTimeout(()=>xrBegin(2),0)}else show(next)}

/* HOME */
function renderHome(){const D=dailyToday(),leak=topLeak();$('#home').innerHTML=`<div class="metrics"><button class="metric"><span class="ey">SKILL</span><b class="pink">${S.skill}</b><span class="mut small">долгий</span></button><button class="metric"><span class="ey">FORM</span><b>${formScore()}</b><span class="mut small">последние 20</span></button><button class="metric"><span class="ey">СЕРИЯ</span><b>${S.streak}</b><span class="mut small">дней</span></button></div><div class="grid2"><button class="tile dailyTile" id="homeDaily"><span class="ey">DAILY #${D.number} · ${D.theme}</span><h2 class="impact">ОДНА РУКА.<br><span class="pink">НО НОРМАЛЬНО.</span></h2><span class="mut small">Replay → size → confidence → drag arguments.</span><div class="dailyBoard"><span>${D.board[0]}</span><span>${D.board[1]}</span><span>?</span></div><span class="go">→</span></button><button class="tile sizingTile" id="homeSizing"><span class="ey">SIZING</span><b>СКОЛЬКО, ГЕНИЙ?</b><span class="mut small">CHECK тоже может быть стратегией.</span><div class="chipsPreview"><i></i><i></i><i></i></div><span class="go">→</span></button><button class="tile" id="homeReview"><span class="ey">CSI</span><b>НУ ЧТО ОПЯТЬ НЕ ТАК?</b><span class="mut small">Иногда — ничего.</span><div class="csiPreview">PRE ●<br>FLOP ●<br>TURN ⚠<br>RIVER ?</div><span class="go">→</span></button><button class="tile" id="homeSwipe"><span class="ey">10 РУК</span><b>POKER SWIPE</b><span class="mut small">Action + size. Медленнее, но всё ещё быстро.</span><div style="font-size:28px;margin-top:10px">← 🃏 →</div><span class="go">→</span></button><button class="tile xrayTile" id="homeXray"><span class="ey">REAL COMBO COUNT</span><b>◎ РЕНТГЕН</b><span class="mut small">Range narrowing + real card removal.</span><div class="miniGrid">${Array.from({length:32},()=>'<i></i>').join('')}</div><span class="go">→</span></button></div><button class="quick5" id="quick5"><div><span class="ey">⚡ У МЕНЯ 5 МИНУТ</span><b>РЕАЛЬНАЯ SMART SESSION</b><div class="mut small">Swipe → Sizing → Memory → Review → X-Ray.</div></div><strong>05:00</strong></button>${leak?`<button class="quick5" id="homeLeak"><div><span class="ey">СЕГОДНЯ ДЛЯ ТЕБЯ</span><b>${leak.concept}</b><div class="mut small">${leak.r} ошибок / ${leak.n} решений</div></div><strong>→</strong></button>`:''}`;$('#homeDaily').onclick=()=>show('daily');$('#homeSizing').onclick=()=>show('sizing');$('#homeReview').onclick=()=>show('review');$('#homeSwipe').onclick=()=>{swSession=[];show('swipe')};$('#homeXray').onclick=()=>show('xray');$('#quick5').onclick=startQuick;if($('#homeLeak'))$('#homeLeak').onclick=()=>show('profile')}

/* NAV / START */
$$('[data-nav]').forEach(b=>b.onclick=()=>show(b.dataset.nav));
function selfCheck(){const ids=['home','swipe','sizing','review','daily','heal','myhands','xray','profile'];const miss=ids.filter(x=>!document.getElementById(x));if(miss.length)throw new Error('Missing screens '+miss.join(','))}
selfCheck();ui();renderStory();
});
</script>
