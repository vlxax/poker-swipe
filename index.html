<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f42b91">
<title>Фриковая Дама — Свайп-тест</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <section id="home" class="screen active home">
    <img src="assets/home.jpg" alt="Фриковая Дама — свайп-тест">
    <button id="homeTap" class="homeTap" aria-label="Начать свайп-тест"></button>
  </section>

  <section id="game" class="screen">
    <div class="topbar">
      <button id="backHome" class="back">←</button>
      <div class="title">СВАЙП-ТЕСТ</div>
      <div id="handCount" class="count">1 / 15</div>
    </div>
    <div class="gameWrap">
      <div class="pokerCard">
        <div class="meta">
          <div class="metaBox"><small>БАНК</small><b id="pot"></b></div>
          <div class="metaBox"><small>СТЕК</small><b id="stack"></b></div>
        </div>
        <div id="cards" class="cards"></div>
        <div class="question">Какое действие<br>ты выберешь?</div>
        <div id="situation" class="situation"></div>
        <div class="info">
          <div><small>ПОЗИЦИЯ</small><b id="position"></b></div>
          <div><small>СТАДИЯ</small><b id="stage"></b></div>
          <div><small>ФОРМАТ</small><b>9-MAX</b></div>
        </div>
        <div class="actions">
          <button class="action fold" data-action="fold">✕<br>ФОЛД</button>
          <button class="action call" data-action="call">↑<br>КОЛЛ</button>
          <button class="action raise" data-action="raise">↗<br>РЕЙЗ</button>
        </div>
      </div>
    </div>
  </section>

  <section id="result" class="screen">
    <div class="resultWrap">
      <div class="resultBox">
        <div id="resultCards" class="cards"></div>
        <div id="flag" class="flag match">MATCH ❤️</div>
        <div id="resultTitle" class="resultTitle"></div>
        <div id="explain" class="explain"></div>
        <div class="ladyBox">
          <b>💋 ФРИКОВАЯ ДАМА</b>
          <p id="ladyText"></p>
        </div>
        <button id="nextHand" class="next">СЛЕДУЮЩАЯ РУКА →</button>
      </div>
    </div>
  </section>

  <section id="verdict" class="screen">
    <div class="verdictWrap">
      <div class="verdictBox">
        <div class="verdictHead">
          <div class="kiss">💋</div>
          <h1>ВЕРДИКТ ФРИКОВОЙ ДАМЫ</h1>
        </div>
        <div id="bigRoast" class="bigRoast"></div>
        <div class="metrics">
          <div class="metric"><small>ПРАВИЛЬНО</small><b id="score"></b></div>
          <div class="metric"><small>ПОГРАНИЧНО</small><b id="yellowCount"></b></div>
          <div class="metric"><small>КРАСНЫХ ФЛАГОВ</small><b id="redCount"></b></div>
        </div>
        <button id="again" class="next" style="margin-top:16px">ЕЩЁ 15 РУК</button>
        <button id="homeBtn" class="next" style="margin-top:10px;background:linear-gradient(90deg,#ff4f9d,#f42687)">НА ГЛАВНУЮ</button>
        <div class="footerNote">Без воды. Без жалости. Только правда и диапазоны.</div>
      </div>
    </div>
  </section>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
