function sizeAnswer(btn,s){$$('[data-size]').forEach(x=>x.disabled=true);btn.classList.add('selected');let a=btn.dataset.size,g=s.best.includes(a)?'g':s.thin.includes(a)?'y':'r';S.size.n++;if(g==='g')S.size.g++;S.leaks.sizing.n++;if(g==='r')S.leaks.sizing.bad++;szSession.n++;if(g==='g')szSession.g++;if(g==='y')szSession.thin++;save();let askGoal=sz%2===1;$('#szRes').innerHTML=`<div class="verdict"><h2 class="${g==='g'?'green':g==='y'?'yellow':'red'}">${g==='g'?'ЧИСТО.':g==='y'?'ЖИВЁТ.':'ПЕРЕБОР.'}</h2><p>${g==='g'?'Размер хорошо выполняет задачу.':g==='y'?'Не катастрофа, но есть размер удобнее.':'Размер требует стратегии, которой эта ситуация не очень хочет.'}</p>${askGoal?`<div class="ey">А ЗАЧЕМ ТЫ СТАВИШЬ?</div><div class="choiceGrid"><button class="choice" data-goal="good">${s.goal}</button><button class="choice" data-goal="bad">Просто хочу сильнее надавить</button></div>`:`<p><b>Почему:</b> ${s.why}</p><button id="nextSz" class="secondary">СЛЕДУЮЩАЯ →</button>`}</div>`;if(askGoal)$$('[data-goal]').forEach(x=>x.onclick=()=>{$$('[data-goal]').forEach(y=>y.disabled=true);x.classList.add('selected');$('#szRes .verdict').insertAdjacentHTML('beforeend',`<p><b>${x.dataset.goal==='good'?'ЛОГИКА ТОЖЕ ЖИВЁТ.':'РАЗМЕР МОЖЕТ БЫТЬ НОРМАЛЬНЫМ. ПРИЧИНА — НЕТ.'}</b></p><p>${s.why}</p><button id="nextSz" class="secondary">СЛЕДУЮЩАЯ →</button>`);$('#nextSz').onclick=nextSize});else $('#nextSz').onclick=nextSize}
function nextSize(){sz++;if(szSession.n>=5){let report=`<div class="hero"><span class="ey">SIZING REPORT</span><h1 class="impact">${szSession.g}/5<br><span class="pink">ЧИСТЫХ</span></h1><p>${szSession.g>=4?'Размеры начинают выглядеть осознанно.':'Ты понимаешь, что хочешь поставить. Сколько — пока иногда выбирает настроение.'}</p><div class="row"><span>Чисто</span><b>${szSession.g}</b></div><div class="row"><span>Допустимо</span><b>${szSession.thin}</b></div><button id="szAgain" class="primary">ЕЩЁ 5 →</button></div>`;$('#sizingArea').innerHTML=report;$('#szAgain').onclick=()=>{szSession={n:0,g:0,thin:0};renderSizing()}}else renderSizing()}

// REVIEW: one attempt, reason, real repair UI.
let ci=0,casePick=null;
function renderReview(){let c=CASES[ci%CASES.length];casePick=null;$('#reviewArea').innerHTML=`<div class="hero"><span class="ey">🧠 НУ ЧТО ОПЯТЬ НЕ ТАК?</span><h1 class="impact">НАЙДИ ПЕРВОЕ<br><span class="pink">ПЛОХОЕ РЕШЕНИЕ.</span></h1><p class="mut">Одна попытка. Выбираешь конкретное действие, объясняешь почему и потом реально чинишь линию.</p></div><div class="card"><div class="ey">${c.title}</div>${board(c.board)}${hand(c.hero)}${c.actions.map((x,i)=>`<button class="timeline" data-ci="${i}"><span class="ey">${x[0]}</span><br><b>${x[1]}</b></button>`).join('')}<div id="caseConfirm"></div><div id="caseRes"></div></div>`;$$('[data-ci]').forEach(b=>b.onclick=()=>{$$('[data-ci]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');casePick=+b.dataset.ci;$('#caseConfirm').innerHTML='<button id="caseSure" class="primary">Я УВЕРЕН →</button>';$('#caseSure').onclick=()=>caseReason(c)})}
function caseReason(c){$$('[data-ci]').forEach(x=>x.disabled=true);$('#caseConfirm').innerHTML=`<div class="verdict"><div class="ey">ПОЧЕМУ ИМЕННО ЗДЕСЬ?</div><div class="choiceGrid">${c.why_opts.map((x,i)=>`<button class="choice" data-why="${i}">${x}</button>`).join('')}</div></div>`;$$('[data-why]').forEach(b=>b.onclick=()=>{let r=+b.dataset.why;$$('[data-why]').forEach(x=>x.disabled=true);b.classList.add('selected');caseReveal(c,r)})}
function caseReveal(c,r){let point=casePick===c.bad,logic=r===c.why_best;$$('[data-ci]').forEach((x,i)=>{if(i===c.bad)x.classList.add('correct');if(i===casePick&&!point)x.classList.add('wrong')});$('#caseRes').innerHTML=`<div class="verdict"><h2 class="${point?'green':'red'}">${point?'ТОЧКУ НАШЁЛ.':'ТЫ ЛЕЧИШЬ СИМПТОМ.'}</h2><div class="row"><span>Точка ошибки</span><b>${point?'✓':'✕'}</b></div><div class="row"><span>Логика</span><b>${logic?'✓':'✕'}</b></div><p>${c.reason}</p><div class="lab"><div class="ey">А ТЕПЕРЬ ПОЧИНИ</div><h3>Что делаешь вместо проблемного решения?</h3><div class="choiceGrid">${c.repair.map(x=>`<button class="choice" data-repair="${x}">${x}</button>`).join('')}</div><div id="repairRes"></div></div></div>`;$$('[data-repair]').forEach(b=>b.onclick=()=>{let a=b.dataset.repair;$$('[data-repair]').forEach(x=>x.disabled=true);b.classList.add('selected');let ok=c.repair_best.includes(a);$('#repairRes').innerHTML=`<h3 class="${ok?'green':'red'}">${ok?'ВОТ ТЕПЕРЬ ЛИНИЯ ЖИВЁТ.':'АВАРИЮ НАШЛИ И СНОВА УСТРОИЛИ.'}</h3><p><b>Запомни:</b> ${c.lesson}</p><button id="nextCase" class="secondary">НОВОЕ ДЕЛО →</button>`;$('#nextCase').onclick=()=>{ci++;renderReview()}})}

// DAILY: reveal streets -> commit -> reasons -> arguments -> transfer test.
let ds=0,dchoice=null;
function renderDaily(){ds=0;dchoice=null;$('#dailyArea').innerHTML=`<div class="hero"><span class="ey">☠️ DAILY · ОДНА РАЗДАЧА</span><h1 class="impact">СЕГОДНЯ<br><span class="pink">ПРИДЁТСЯ ПОДУМАТЬ.</span></h1><p>${DAILY.villain} · финальный стол · ${DAILY.eff} BB.</p><div class="row"><span>Выплаты</span><b>${DAILY.payouts.join(' · ')}</b></div><button id="dailyBegin" class="primary">ПОКАЗАТЬ ПРЕФЛОП →</button></div>`;$('#dailyBegin').onclick=()=>dailyStreet()}
function dailyStreet(){let x=DAILY.streets[ds];$('#dailyArea').innerHTML=`<div class="card"><div class="ey">DAILY · ${x[0]} · ${ds+1}/4</div>${ds===0?hand(DAILY.hero):''}<div class="dailyStreet"><b>${x[1]}</b><p>${x[2]}</p></div>${ds<3?'<button id="dailyNext" class="primary">ДАЛЬШЕ →</button>':`<h2>ЧТО ДЕЛАЕШЬ?</h2><div class="sizes">${DAILY.options.map(o=>`<button class="size" data-daily="${o}">${o}</button>`).join('')}</div><div id="dailyConfirm"></div>`}</div>`;if(ds<3)$('#dailyNext').onclick=()=>{ds++;dailyStreet()};else $$('[data-daily]').forEach(b=>b.onclick=()=>{$$('[data-daily]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');dchoice=b.dataset.daily;$('#dailyConfirm').innerHTML=`<button id="dailyLock" class="primary" style="margin-top:12px">${dchoice}. Я УВЕРЕН →</button>`;$('#dailyLock').onclick=dailyReasons})}
function dailyReasons(){$('#dailyConfirm').innerHTML=`<div class="verdict"><div class="ey">ТЕПЕРЬ ЗАЩИТИ РЕШЕНИЕ</div><h3>Выбери две причины.</h3><div class="choiceGrid">${DAILY.reasons.map((r,i)=>`<button class="choice" data-dr="${i}">${r}</button>`).join('')}</div><button id="revealDaily" class="primary" style="margin-top:10px">ВСКРЫТЬ РАЗДАЧУ →</button></div>`;let rs=[];$$('[data-dr]').forEach(b=>b.onclick=()=>{let i=+b.dataset.dr;if(rs.includes(i)){rs=rs.filter(x=>x!==i);b.classList.remove('selected')}else if(rs.length<2){rs.push(i);b.classList.add('selected')}});$('#revealDaily').onclick=()=>dailyReveal(rs)}
function dailyReveal(rs){let best=DAILY.best.includes(dchoice),live=DAILY.live.includes(dchoice);$('#dailyArea').innerHTML=`<div class="hero"><span class="ey">ВЕРДИКТ DAILY</span><h1 class="impact">${best?'СИЛЬНО.':live?'ЖИВЁТ,<br><span class="pink">НО НЕДОБРАЛ.</span>':'НЕ ТУДА.'}</h1><p>Твой выбор: <b>${dchoice}</b>. ${best?'Ты нашёл линию, которая лучше реализует вэлью этой руки.':live?'Чек не уничтожает EV, но оставляет часть вэлью на столе.':'Эта линия хуже использует структуру диапазонов на ривере.'}</p></div><div class="section"><div class="lab"><h3>ЗА СТАВКУ</h3>${DAILY.forBet.map(x=>`<p>+ ${x}</p>`).join('')}</div><div class="lab"><h3>ПРОТИВ</h3>${DAILY.against.map(x=>`<p>− ${x}</p>`).join('')}</div><div class="leak"><div class="ey">🔑 КЛЮЧ РАЗДАЧИ</div><h3>${DAILY.key}</h3></div><div class="card"><div class="ey">ТОЧНО ПОНЯЛ?</div><h3>Та же идея. Другие карты.</h3>${board(DAILY.transfer.board)}${hand(DAILY.transfer.hero)}<p>${DAILY.transfer.ctx}</p><div class="choiceGrid">${DAILY.transfer.opts.map(x=>`<button class="choice" data-transfer="${x}">${x}</button>`).join('')}</div><div id="transferRes"></div></div></div>`;$$('[data-transfer]').forEach(b=>b.onclick=()=>{$$('[data-transfer]').forEach(x=>x.disabled=true);b.classList.add('selected');$('#transferRes').innerHTML=`<h3 class="${b.dataset.transfer===DAILY.transfer.best?'green':'red'}">${b.dataset.transfer===DAILY.transfer.best?'ПОНЯЛ.':'ПРОЧИТАЛ — НЕ ЗНАЧИТ ПОНЯЛ.'}</h3><p>${b.dataset.transfer===DAILY.transfer.best?'Значит, предыдущий разбор был не декоративным.':'Идею видели. Применить пока забыли.'}</p>`})}

// HEAL: real micro-exercises, not swipe.
function renderHeal(){let l=S.leaks.river;$('#healArea').innerHTML=`<div class="hero"><span class="ey">💊 ЛЕЧИМ · RIVER BLUFF-CATCH</span><h1 class="impact">НЕ УГАДЫВАЕМ.<br><span class="pink">СЧИТАЕМ.</span></h1><p class="mut">Причина твоего лика — не одна кнопка CALL. Здесь разбираем блефы, блокеры и требуемую equity.</p><div class="row"><span>Сейчас</span><b>${l.score}/100 · ${l.status}</b></div></div><div class="section"><div class="lab"><div class="ey">1 · НАЙДИ БЛЕФЫ</div><h3>Для колла нужно хотя бы 6 естественных блефов. Найди их.</h3><div class="comboGrid">${['QTs','T9s','76s','A5s','Q9s','65s','AA','KQ'].map((x,i)=>`<button class="combo" data-combo="${i}">${x}</button>`).join('')}</div><button id="bluffCheck" class="secondary">ПРОВЕРИТЬ →</button><div id="bluffRes"></div></div><div class="lab"><div class="ey">2 · POT ODDS</div><h3>Банк 20 BB. Оппонент ставит 15 BB. Сколько equity нужно для колла?</h3><div class="choiceGrid"><button class="choice" data-po="25">25%</button><button class="choice" data-po="30">30%</button><button class="choice" data-po="37.5">37.5%</button><button class="choice" data-po="43">43%</button></div><div id="poRes"></div></div><div class="lab"><div class="ey">3 · BLOCKER LAB</div><h3>Какая рука меньше мешает естественным блефам оппонента?</h3><div class="choiceGrid"><button class="choice" data-bl="A♠Q♣">A♠Q♣</button><button class="choice" data-bl="A♥Q♣">A♥Q♣</button><button class="choice" data-bl="Q♠J♠">Q♠J♠</button></div><div id="blRes"></div></div></div>`;$$('[data-combo]').forEach(b=>b.onclick=()=>b.classList.toggle('selected'));$('#bluffCheck').onclick=()=>{let n=$$('.combo.selected').length;$('#bluffRes').innerHTML=`<p><b>${n>=6?'Блефов набралось. Теперь проверь, доходят ли они сюда по линии.':'НУ И КОГО МЫ КОЛЛИМ?'}</b><br>Нужно 6, ты нашёл ${n}. Вера в людей — прекрасна, но equity ею не оплачивается.</p>`};$$('[data-po]').forEach(b=>b.onclick=()=>{$$('[data-po]').forEach(x=>x.disabled=true);b.classList.add('selected');$('#poRes').innerHTML=`<p><b>${b.dataset.po==='30'?'ДА. 30%.':'НЕТ. НУЖНО 30%.'}</b> После ставки итоговый банк будет 50 BB, а колл стоит 15 BB: 15/50 = 30%.</p>`});$$('[data-bl]').forEach(b=>b.onclick=()=>{$$('[data-bl]').forEach(x=>x.disabled=true);b.classList.add('selected');$('#blRes').innerHTML=`<p><b>${b.dataset.bl==='A♥Q♣'?'ЛОГИКА ЖИВЁТ.':'ПОСМОТРИ НА МАСТИ ЕЩЁ РАЗ.'}</b> Блокер хорош только тогда, когда он ухудшает вэлью оппонента сильнее, чем уничтожает его блефы.</p>`})}

// MY HANDS: journal + calculators + replay-ish input + useful analysis.
let calcTab='pot',pickTarget=null,sel={hero:[],villain:[],board:[]};
function renderMy(){let list=S.hands.slice(0,6).map(h=>`<div class="row"><div><b>${h.hero} · ${h.tag}</b><div class="mut small">${h.verdict}</div></div><span>${h.street}</span></div>`).join('')||'<div class="row"><span class="mut">Пока пусто. После катки принеси сюда руку, которая не даёт спокойно жить.</span></div>';$('#myArea').innerHTML=`<div class="hero"><span class="ey">🃏 МОИ</span><h1 class="impact">КУЛЕР ИЛИ<br><span class="pink">МОЖНО БЫЛО ДЕШЕВЛЕ?</span></h1><p class="mut">Личный покерный журнал: занеси реальную раздачу, посчитай математику и сохрани вывод в своё досье.</p><button id="newHand" class="primary">+ ДОБАВИТЬ РАЗДАЧУ</button><button id="quickCalc" class="secondary">🧮 БЫСТРЫЙ РАСЧЁТ →</button></div><div class="section"><h3>ПОСЛЕДНИЕ РАЗДАЧИ</h3>${list}</div>`;$('#newHand').onclick=handBuilder;$('#quickCalc').onclick=calcModal}
function picker(label,target,max){return`<div class="lab"><div class="ey">${label}</div><div class="pickerRanks">${['A','K','Q','J','T','9','8','7','6','5','4','3','2'].map(r=>`<button class="pick" data-rank="${r}" data-target="${target}" data-max="${max}">${r}</button>`).join('')}</div><div class="suitBtns">${['♠','♣','♥','♦'].map(s=>`<button class="suitBtn ${/[♥♦]/.test(s)?'rs':''}" data-suit="${s}" data-target="${target}" data-max="${max}">${s}</button>`).join('')}</div><div id="sel-${target}" class="row"><span>Выбрано</span><b>${sel[target].join(' ')||'—'}</b></div></div>`}
let pendingRank={};
function bindPicker(){$$('[data-rank]').forEach(b=>b.onclick=()=>{pendingRank[b.dataset.target]=b.dataset.rank;$$(`[data-rank][data-target="${b.dataset.target}"]`).forEach(x=>x.classList.toggle('selected',x===b))});$$('[data-suit]').forEach(b=>b.onclick=()=>{let t=b.dataset.target,r=pendingRank[t];if(!r)return;let c=r+b.dataset.suit,max=+b.dataset.max;if(sel.hero.includes(c)||sel.villain.includes(c)||sel.board.includes(c))return;if(sel[t].length<max)sel[t].push(c);$(`#sel-${t} b`).textContent=sel[t].join(' ');pendingRank[t]=null;$$(`[data-rank][data-target="${t}"]`).forEach(x=>x.classList.remove('selected'))})}
function handBuilder(){sel={hero:[],villain:[],board:[]};$('#myArea').innerHTML=`<div class="section"><div class="hero" style="margin:0 0 12px"><span class="ey">НОВАЯ РАЗДАЧА</span><h1 class="impact">ПОВТОРИМ,<br><span class="pink">КАК ЭТО БЫЛО.</span></h1></div>${picker('ТВОЯ РУКА','hero',2)}<div class="formRow"><div class="inputBox"><span class="ey">ТВОЯ ПОЗИЦИЯ</span><select id="myPos"><option>BTN</option><option>CO</option><option>HJ</option><option>UTG</option><option>SB</option><option>BB</option></select></div><div class="inputBox"><span class="ey">ОППОНЕНТ</span><select id="vPos"><option>BB</option><option>SB</option><option>BTN</option><option>CO</option><option>HJ</option><option>UTG</option></select></div></div><div class="inputBox"><span class="ey">ЭФФЕКТИВНЫЙ СТЕК · BB</span><input id="stackIn" type="number" value="40"></div>${picker('ДОСКА · ДО 5 КАРТ','board',5)}<div class="lab"><div class="ey">ЛИНИЯ</div><div class="inputBox"><input id="preIn" placeholder="Префлоп: например CO 2.2 → BTN колл"></div><div class="inputBox"><input id="flopIn" placeholder="Флоп: чек → 33% → колл"></div><div class="inputBox"><input id="turnIn" placeholder="Тёрн: чек → 75% → колл"></div><div class="inputBox"><input id="riverIn" placeholder="Ривер: 125% → колл"></div></div><div class="lab"><div class="ey">ЧТО ТЕБЯ БЕСПОКОИТ?</div><select id="questionIn" class="inputBox" style="width:100%"><option>Где первая ошибка?</option><option>Это был кулер?</option><option>Можно было потерять меньше?</option><option>Я переиграл руку?</option><option>Что делать на ривере?</option></select></div><button id="analyzeMine" class="primary">РАЗОБРАТЬ →</button><button id="myBack" class="secondary">НАЗАД</button></div>`;bindPicker();$('#myBack').onclick=renderMy;$('#analyzeMine').onclick=analyzeMine}
function analyzeMine(){if(sel.hero.length!==2)return openModal('<h2>НУЖНЫ ДВЕ КАРТЫ.</h2><p>Даже Фриковая Дама не анализирует телепатию.</p>');let streets=[['ПРЕФЛОП',$('#preIn').value],['ФЛОП',$('#flopIn').value],['ТЁРН',$('#turnIn').value],['РИВЕР',$('#riverIn').value]].filter(x=>x[1].trim());let q=[82,74,58,46].slice(0,streets.length);let first=streets.length>2?'ТЁРН':streets[streets.length-1]?.[0]||'ПРЕФЛОП';let text=`По введённой линии первым я бы проверила ${first.toLowerCase()}: там банк начинает расти быстрее, чем понятна цель продолжения. Не «смотри на SPR вообще», а спроси: какие худшие руки платят именно твоему размеру и какие лучшие ты реально выбиваешь?`;let verdict=streets.some(x=>/125|all|олл/i.test(x[1]))?'МОЖНО БЫЛО ДЕШЕВЛЕ':'НУЖЕН РАЗБОР ЛИНИИ';$('#myArea').innerHTML=`<div class="section"><div class="hero" style="margin:0 0 12px"><span class="ey">ВЕРДИКТ ФРИКОВОЙ ДАМЫ</span><h1 class="impact">${verdict}</h1><p>${text}</p></div><div class="card"><div class="ey">КАК МЕНЯЛОСЬ КАЧЕСТВО ЛИНИИ</div>${streets.map((x,i)=>`<div class="quality"><b>${x[0]}</b><div class="qbar"><span style="width:${q[i]}%"></span></div><b>${q[i]}</b></div>`).join('')}<p class="mut small">Это диагностическая карта решений по введённой линии, не процент шанса выиграть банк.</p></div><div class="lab"><h3>ПЕРВАЯ ПРОБЛЕМА · ${first}</h3><p>${text}</p></div><div class="lab"><h3>ЧТО МОЖНО ИЗМЕНИТЬ</h3><p><b>1.</b> Перед крупной ставкой назови конкретную цель: вэлью с каких худших рук или фолд каких лучших.</p><p><b>2.</b> Если ответ «не знаю», уменьшай размер или выбирай чек — не строй большой банк по инерции.</p><p><b>3.</b> На ривере оценивай руку относительно размера ставки и диапазона, а не по названию «топ-пара».</p><p class="pink"><b>Карты могут быть кулером. Размер ущерба иногда уже авторская работа.</b></p></div><button id="saveMine" class="primary">СОХРАНИТЬ В ДОСЬЕ →</button><button id="mineAgain" class="secondary">ЕЩЁ РАЗДАЧУ</button></div>`;$('#saveMine').onclick=()=>{S.hands.unshift({hero:sel.hero.join(' '),tag:$('#questionIn')?.value||'Разбор',verdict,street:first});save();renderMy()};$('#mineAgain').onclick=handBuilder}
function calcModal(){calcTab='pot';openModal(`<div class="ey">🧮 БЫСТРЫЙ РАСЧЁТ</div><h2>МАТЕМАТИКА БЕЗ ДУХОВНОСТИ.</h2><div class="calcTabs"><button id="potTab" class="tab on">POT ODDS</button><button id="eqTab" class="tab">ALL-IN</button></div><div id="calcBody"></div>`);setTimeout(()=>{let pot=()=>{$('#potTab').classList.add('on');$('#eqTab').classList.remove('on');$('#calcBody').innerHTML=`<div class="inputBox"><span class="ey">БАНК ДО СТАВКИ</span><input id="potV" type="number" value="100"></div><div class="inputBox"><span class="ey">СТАВКА ОППОНЕНТА</span><input id="betV" type="number" value="50"></div><button id="potCalc" class="primary">ПОСЧИТАТЬ →</button><div id="potOut"></div>`;$('#potCalc').onclick=()=>{let p=+$(' #potV'.trim()).value,b=+$(' #betV'.trim()).value,need=b/(p+2*b)*100;$('#potOut').innerHTML=`<div class="leak"><div class="ey">ДЛЯ КОЛЛА НУЖНО</div><h2>${need.toFixed(1)}% EQUITY</h2><p>Колл стоит ${b}, итоговый банк после колла — ${p+2*b}. ${b}/${p+2*b} = ${need.toFixed(1)}%.</p></div>`}};let eq=()=>{$('#eqTab').classList.add('on');$('#potTab').classList.remove('on');$('#calcBody').innerHTML=`<p class="mut">Быстрый all-in расчёт по известным двум рукам. Выбери карты текстом: например <b>As Ks</b> и <b>Qh Qd</b>. Борд можно оставить пустым или написать через пробел.</p><div class="inputBox"><input id="eqH" placeholder="Твои карты: As Ks"></div><div class="inputBox"><input id="eqV" placeholder="Оппонент: Qh Qd"></div><div class="inputBox"><input id="eqB" placeholder="Борд: Ah 7d 2c (необязательно)"></div><button id="eqCalc" class="primary">ПОСЧИТАТЬ ПРИМЕРНО →</button><div id="eqOut"></div>`;$('#eqCalc').onclick=()=>equityCalc($('#eqH').value,$('#eqV').value,$('#eqB').value)};$('#potTab').onclick=pot;$('#eqTab').onclick=eq;pot()},0)}
// Lightweight Monte-Carlo all-in equity evaluator.
const ranks='23456789TJQKA',suits='shdc';
function parseCards(s){return s.trim().split(/\s+/).filter(Boolean).map(x=>x.length>=2?x[0].toUpperCase()+x[1].toLowerCase():'')}
function score5(cs){let rs=cs.map(c=>ranks.indexOf(c[0])+2).sort((a,b)=>b-a),ss=cs.map(c=>c[1]),cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);let uniq=[...new Set(rs)].sort((a,b)=>b-a);if(uniq[0]===14)uniq.push(1);let sh=0;for(let i=0;i<=uniq.length-5;i++)if(uniq[i]-uniq[i+4]===4){sh=uniq[i];break}let flush=ss.every(x=>x===ss[0]);let groups=Object.entries(cnt).map(([r,n])=>[+r,n]).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);if(flush&&sh)return[8,sh];if(groups[0][1]===4)return[7,groups[0][0],groups[1][0]];if(groups[0][1]===3&&groups[1]?.[1]>=2)return[6,groups[0][0],groups[1][0]];if(flush)return[5,...rs];if(sh)return[4,sh];if(groups[0][1]===3)return[3,groups[0][0],...groups.filter(x=>x[1]===1).map(x=>x[0]).slice(0,2)];let pairs=groups.filter(x=>x[1]===2);if(pairs.length>=2)return[2,pairs[0][0],pairs[1][0],groups.find(x=>x[1]===1)?.[0]||0];if(pairs.length===1)return[1,pairs[0][0],...groups.filter(x=>x[1]===1).map(x=>x[0]).slice(0,3)];return[0,...rs]}
function best7(cs){let best=null;for(let a=0;a<3;a++)for(let b=a+1;b<4;b++)for(let c=b+1;c<5;c++)for(let d=c+1;d<6;d++)for(let e=d+1;e<7;e++){let sc=score5([cs[a],cs[b],cs[c],cs[d],cs[e]]);if(!best||cmp(sc,best)>0)best=sc}return best}function cmp(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){let d=(a[i]||0)-(b[i]||0);if(d)return d}return 0}
function equityCalc(hs,vs,bs){let h=parseCards(hs),v=parseCards(vs),b=parseCards(bs);if(h.length!==2||v.length!==2||b.length>5)return $('#eqOut').innerHTML='<p class="red"><b>Проверь карты. Нужны две руки по две карты.</b></p>';let used=new Set([...h,...v,...b]);if(used.size!==h.length+v.length+b.length)return $('#eqOut').innerHTML='<p class="red"><b>Одна карта не может быть в двух местах.</b></p>';let deck=[];for(let r of ranks)for(let s of suits){let c=r+s;if(!used.has(c))deck.push(c)}let hw=0,vw=0,t=0,N=3500;for(let z=0;z<N;z++){let pool=deck.slice();for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}let run=b.concat(pool.slice(0,5-b.length)),c=cmp(best7(h.concat(run)),best7(v.concat(run)));if(c>0)hw++;else if(c<0)vw++;else t++}let hp=(hw+t/2)/N*100,vp=100-hp;$('#eqOut').innerHTML=`<div class="leak"><div class="ey">ALL-IN EQUITY · ПРИМЕРНО</div><h2>ТЫ ${hp.toFixed(1)}% · ОППОНЕНТ ${vp.toFixed(1)}%</h2><p>${hp>vp?'По математике выставление впереди. Проиграть всё равно разрешается — колода читала правила.':'Ты позади по equity, но это ещё не автоматически означает плохое выставление.'}</p></div>`}

let swSession={n:0,g:0,y:0,r:0};
function nodeMode(s){let t=(s.ctx+' '+(s.history||[]).map(x=>x[1]).join(' ')).toLowerCase();let post=s.tags?.includes('postflop');let checked=/чекнул|чек\.|чек$|снова чек|ривер bb чек|терн — чек|bb чек/.test(t);let facing=/поставил|овербет|ставит|bet/.test((s.ctx||'').toLowerCase());if(post&&checked&&!facing)return'checkedTo';return'facing'}
function legalFor(s){if(!s.tags?.includes('postflop'))return['fold','call','raise'];let m=nodeMode(s);return m==='checkedTo'?['check','bet']:['fold','call','raise']}
function mapBaseAction(s,a){if(legalFor(s).includes('check'))return a==='raise'?'bet':a==='call'?'check':a;return a}

function swipeAnswer(a){clearTimeout(swTimer);let s=BASE[si%BASE.length],ok=mapBaseAction(s,s.ok),yl=mapBaseAction(s,s.yellow),g=a===ok?'g':a===yl?'y':'r';S.played++;S.swipeRecent.push(g);S.swipeRecent=S.swipeRecent.slice(-40);S.history.push({type:'swipe',grade:g,t:Date.now(),tags:s.tags||[]});S.history=S.history.slice(-300);swSession.n++;swSession[g]++;bumpConcept(s.tags,g);let bucket=s.tags?.includes('preflop')?S.pre:S.post;bucket.n++;if(g==='g'){S.good++;bucket.g++;S.skill=Math.min(99,S.skill+1)}else if(g==='y'){S.mid++}else{S.bad++;S.skill=Math.max(20,S.skill-1);S.errors.unshift({id:s.id,hand:s.hero.join(' '),street:s.tags?.includes('river')?'РИВЕР':s.tags?.includes('turn')?'ТЁРН':s.tags?.includes('flop')?'ФЛОП':'ПРЕФЛОП',why:s.why,date:new Date().toLocaleDateString('ru-RU'),tag:s.tags?.includes('bluff-catch')?'river':s.tags?.includes('turn')?'turn':s.tags?.includes('bb-defense')?'bb':'other',choice:actionLabel(a)});if(s.tags?.includes('bluff-catch')){S.leaks.river.n++;S.leaks.river.bad++;S.leaks.river.score=Math.max(20,S.leaks.river.score-2)}}save();ui();$('.actions').classList.add('hidden');$('#swipeCard').classList.add(g);let repeated=g==='r'&&s.tags?.includes('bluff-catch')&&S.errors.filter(e=>e.tag==='river').length>=3,askConf=S.played%6===0,askWhy=S.played%7===0;let title=g==='g'?'ЧИСТО.':g==='y'?'ТОНКО, НО ЖИВЁТ.':repeated?'ОПЯТЬ?':'ДОРОГАЯ ОШИБКА.';let line=g==='g'?'Даже придраться немного неприятно.':g==='y'?'Решение не разваливается, но есть вариант лучше.':repeated?'Карты новые. Привычка почему-то та же.':'Вот здесь уже есть что разбирать.';let extra=askConf?`<div class="confRow"><button data-swconf="0">СОМНЕВАЛСЯ</button><button data-swconf="1">СКОРЕЕ УВЕРЕН</button><button data-swconf="2">БЫЛ УВЕРЕН</button></div>`:'';let cta=g==='g'?(s.tags?.includes('river')?'<button id="swExplain" class="secondary">ПОЧЕМУ ЭТО РАБОТАЕТ? →</button>':''):g==='y'?'<button id="swExplain" class="secondary">ГДЕ ТУТ ТОНКО? →</button>':'<button id="swExplain" class="secondary">ВСКРЫТЬ РАЗДАЧУ →</button>';$('#swipeVerdict').innerHTML=`<h2 class="${g==='g'?'green':g==='y'?'yellow':'red'}">${title}</h2><p><b>${line}</b></p>${extra}${cta}<p class="mut small">${repeated?'Автопереход остановлен: это уже похоже на лик.':'Следующая раздача откроется сама.'}</p>`;$('#swipeVerdict').classList.remove('hidden');$$('[data-swconf]').forEach(b=>b.onclick=()=>{S.confidence.push({correct:g==='g',level:+b.dataset.swconf,tag:(s.tags||[]).join(','),t:Date.now()});save();$$('[data-swconf]').forEach(x=>x.disabled=true);b.classList.add('selected')});if($('#swExplain'))$('#swExplain').onclick=()=>{clearTimeout(swTimer);let specific=s.why;openModal(`<div class="ey">РАЗБОР КОНКРЕТНОГО СПОТА</div><h2>${title}</h2><p>${specific}</p><div class="row"><span>Твой выбор</span><b>${actionLabel(a)}</b></div><div class="row"><span>Предпочтительно</span><b>${actionLabel(ok)}</b></div><p class="pink"><b>${g==='r'?'Сила руки — не индульгенция. Смотри на линию и размер.':'Ответ запомнить мало. Нужна причина, которую перенесёшь на другую руку.'}</b></p>`) };if(swSession.n>=10&&!repeated){clearTimeout(swTimer);setTimeout(()=>renderSwipeReport(),g==='g'?2200:g==='y'?3000:3900);return}if(!repeated){let ms=g==='g'?2600:g==='y'?3600:4700;swTimer=setTimeout(()=>{si++;renderSwipe()},ms)}}
function renderSwipeReport(){$('#swipeCard').className='card';$('#swipeCard').innerHTML=`<div class="ey">СЕССИЯ · 10 РЕШЕНИЙ</div><h2 class="impact" style="font-size:38px">${swSession.g} ЧИСТО.<br><span class="pink">${swSession.r} ДОРОГИХ.</span></h2><div class="row"><span>Чисто</span><b>${swSession.g}</b></div><div class="row"><span>Тонко/допустимо</span><b>${swSession.y}</b></div><div class="row"><span>Ошибки</span><b>${swSession.r}</b></div><p>${swSession.r>=3?'Красного уже больше, чем хотелось бы. Досье пополнилось.':swSession.g>=7?'Похоже на тренировку, а не на благотворительность.':'Нормально. Но есть что унести в YOU.'}</p><button id="swMore" class="primary">ЕЩЁ 10 →</button><button id="swYou" class="secondary">ПОСМОТРЕТЬ YOU →</button>`;$('#swipeVerdict').classList.add('hidden');$('.actions').classList.add('hidden');$('#swMore').onclick=()=>{swSession={n:0,g:0,y:0,r:0};si++;renderSwipe()};$('#swYou').onclick=()=>show('profile')}

function renderSizing(){let s=SIZING[sz%SIZING.length],mode=sizeModeIndex%5;let head=`<div class="hero"><span class="ey">📏 СКОЛЬКО, ГЕНИЙ?</span><h1 class="impact">СКОЛЬКО<br><span class="pink">И ЗАЧЕМ?</span></h1><p class="mut">Размер — это не число из памяти. Он должен выполнять конкретную работу.</p></div>`;let body=`<div class="card"><div class="ey">${s.street} · ${s.pos}</div><div class="money"><div class="moneyBox"><span class="ey">БАНК</span><b>${s.pot} BB</b></div><div class="moneyBox"><span class="ey">СТЕК</span><b>${s.eff} BB</b></div></div>${board(s.board)}${hand(s.hero)}<p class="center"><b>${s.ctx}</b></p>`;if(mode===2){body+=`<div class="ey">КАКАЯ РУКА ХОЧЕТ КРУПНЕЕ?</div><div class="compareBox"><button class="compareHand" data-compare="hero">${hand(s.hero)}<b>РУКА A</b></button><button class="compareHand" data-compare="alt">${hand(s.hero[0][0]==='A'?['Q♣','J♣']:['A♠','K♥'])}<b>РУКА B</b></button></div><div id="szRes"></div>`}else if(mode===3){body+=`<div class="ey">ВЫБЕРИ ВСЁ, ЧТО ЖИВЁТ</div><div class="sizes">${s.opts.map(o=>`<button class="size" data-multi-size="${o}">${o}</button>`).join('')}</div><div class="multiHint">Можно выбрать несколько. Потом зафиксируем.</div><button id="multiLock" class="primary" style="margin-top:10px">ЗАФИКСИРОВАТЬ →</button><div id="szRes"></div>`}else if(mode===4){body+=`<div class="ey">REG MODE · СВОЙ РАЗМЕР</div><div class="sliderWrap"><div id="sliderVal" class="bigValue">60%</div><input id="sizeSlider" type="range" min="0" max="150" step="1" value="60"></div><button id="sliderLock" class="primary">ЗАФИКСИРОВАТЬ →</button><div id="szRes"></div>`}else{body+=`<div class="sizes">${s.opts.map(o=>`<button class="size" data-size="${o}">${o}</button>`).join('')}</div><div id="szRes"></div>`}body+='</div>';$('#sizingArea').innerHTML=head+body;if(mode===2){$$('[data-compare]').forEach(b=>b.onclick=()=>{$$('[data-compare]').forEach(x=>x.disabled=true);b.classList.add('selected');let ok=b.dataset.compare==='hero'&&(s.best.includes('75%')||s.best.includes('100%')||s.best.includes('125%'));finishSizeCustom(ok?s.best[0]:s.thin[0]||'ЧЕК',s,ok?'g':'y','Сравнение рук')})}else if(mode===3){$$('[data-multi-size]').forEach(b=>b.onclick=()=>b.classList.toggle('selected'));$('#multiLock').onclick=()=>{let picks=$$('.size.selected').map(x=>x.dataset.multiSize),bestHit=s.best.every(x=>picks.includes(x)),bad=picks.some(x=>!s.best.includes(x)&&!s.thin.includes(x)),g=bestHit&&!bad?'g':bad?'r':'y';$$('[data-multi-size]').forEach(x=>x.disabled=true);finishSizeCustom(picks.join(', ')||'ничего',s,g,'Несколько размеров')}}else if(mode===4){$('#sizeSlider').oninput=e=>$('#sliderVal').textContent=e.target.value+'%';$('#sliderLock').onclick=()=>{let v=+$('#sizeSlider').value,bestNums=s.best.map(x=>parseInt(x)).filter(Number.isFinite),g='y';if(bestNums.length){let d=Math.min(...bestNums.map(x=>Math.abs(x-v)));g=d<=12?'g':d<=28?'y':'r'}else if(s.best.includes('ЧЕК'))g=v<=10?'g':v<=30?'y':'r';finishSizeCustom(v+'%',s,g,'Свободный размер')}}else $$('[data-size]').forEach(b=>b.onclick=()=>sizeAnswer(b,s))}

function parseAct(v){if(v==='check'||v==='fold'||v==='call'||v==='raise')return{a:v,p:0};let m=v.match(/bet(\d+)/);return{a:'bet',p:m?+m[1]:0}}
function buildMath(){let pot=+$('#startPot').value||5.4,stack=+$('#stackIn').value||40,rows=[];for(let k of ['flop','turn','river']){let v=parseAct($('#'+k+'V').value),h=parseAct($('#'+k+'H').value),before=pot,need=null;if(v.a==='bet'){let bet=before*v.p/100;if(h.a==='call'){need=bet/(before+2*bet)*100;pot=before+2*bet}else if(h.a==='raise'){pot=before+bet*3}else pot=before+bet}else if(h.a==='bet'){let bet=before*h.p/100;pot=before+bet*2}rows.push({street:k.toUpperCase(),before,after:pot,need,v,h,spr:pot?stack/pot:0})}return rows}
function equityAt(hero,vill,bd,N=1600){if(hero.length!==2||vill.length!==2)return null;let h=hero.map(symbolToCode),v=vill.map(symbolToCode),b=bd.map(symbolToCode);let used=new Set([...h,...v,...b]),deck=[];for(let r of ranks)for(let s of suits){let c=r+s;if(!used.has(c))deck.push(c)};if(b.length===5){let c=cmp(best7(h.concat(b)),best7(v.concat(b)));return c>0?100:c<0?0:50}let hw=0,vw=0,t=0;for(let z=0;z<N;z++){let pool=deck.slice();for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}let run=b.concat(pool.slice(0,5-b.length)),c=cmp(best7(h.concat(run)),best7(v.concat(run)));if(c>0)hw++;else if(c<0)vw++;else t++}return (hw+t/2)/N*100}
function symbolToCode(c){let m=c.match(/^([AKQJT2-9])([♠♣♥♦])$/);if(!m)return c;return m[1]+({'♠':'s','♣':'c','♥':'h','♦':'d'}[m[2]])}

function battleIntroV10(k){let o=BATTLES[k],st=bstat(k);$('#battleArea').innerHTML=`<div class="hero"><span class="ey">${o.icon} ${o.name} · ${o.stats}</span><h1 class="impact">МИССИЯ:<br><span class="pink">${o.mission}</span></h1><p>${o.hint}</p>${battleIntel(k)}<div class="mastery"><span style="width:${st.mastery}%"></span></div><p class="mut small">Mastery ${st.mastery}% · часть наблюдений открывается только после игры.</p><button id="battleGo" class="primary">СЕСТЬ ЗА СТОЛ →</button></div>`;$('#battleGo').onclick=()=>{let pool=battlePool(k),idx=Math.floor(Math.random()*pool.length);if(pool.length>1&&idx===st.last)idx=(idx+1)%pool.length;st.last=idx;save();battleHandV10(k,idx,0,[])}}
function battleHandV10(k,idx,step,answers){let o=BATTLES[k],h=battlePool(k)[idx],st=h.streets[step];$('#battleArea').innerHTML=`<div class="card"><div class="ey">${o.name} · ${st.label} · ${step+1}/${h.streets.length}</div>${step===0?hand(h.hero):''}${board(h.board.slice(0,step===0?3:step===1?4:5))}<h2>${st.text}</h2><div class="choiceGrid">${st.opts.map(x=>`<button class="choice" data-vba="${x}">${x}</button>`).join('')}</div><div id="baConfirm"></div><p class="mut small">Никакого green/red до конца руки. Живи с предыдущим решением.</p></div>`;$$('[data-vba]').forEach(b=>b.onclick=()=>{$$('[data-vba]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('#baConfirm').innerHTML='<button id="baLock" class="primary" style="margin-top:10px">ЗАФИКСИРОВАТЬ →</button>';$('#baLock').onclick=()=>{let a=answers.concat(b.dataset.vba);step+1<h.streets.length?battleHandV10(k,idx,step+1,a):battleReportV10(k,idx,a)}})}
function battleReportV10(k,idx,answers){let o=BATTLES[k],h=battlePool(k)[idx],exploitHits=answers.filter((a,i)=>a===h.streets[i].best).length,theoryHits=answers.filter((a,i)=>a===(h.streets[i].theory||h.streets[i].best)).length,exploit=Math.round(exploitHits/h.streets.length*100),theory=Math.round(theoryHits/h.streets.length*100);let readOpts=k==='phone'?['Слишком много коллит','Слишком много фолдит','Слишком много блефует']:k==='nit'?['Слишком много коллит','Слишком много фолдит','Слишком много блефует']:k==='maniac'?['Мало блефует','Переблефовывает','Никогда не рейзит']:['Пассивен, большая агрессия сильна','Переблефовывает river','Overfold flop'],readBest=k==='phone'?0:k==='nit'?1:k==='maniac'?1:0;$('#battleArea').innerHTML=`<div class="hero"><span class="ey">BATTLE ЗАКОНЧЕН · ${o.name}</span><h1 class="impact">${exploit>=67?'ОППОНЕНТА<br><span class="pink">НАЧАЛ ЧИТАТЬ.</span>':'ПОКА ИГРАЕШЬ<br><span class="pink">ПРОТИВ СРЕДНЕГО.</span>'}</h1><div class="row"><span>БАЗОВАЯ ЛИНИЯ</span><b>${theory}/100</b></div><div class="row"><span>ЭКСПЛОЙТ</span><b>${exploit}/100</b></div></div><div class="section">${h.streets.map((s,i)=>`<div class="lab"><div class="ey">${s.label}</div><h3>${answers[i]} ${answers[i]===s.best?'✓':'✕'}</h3><p>${s.why}</p></div>`).join('')}<div class="leak"><div class="ey">ЧТО ТЫ О НЁМ ПОНЯЛ?</div><div class="choiceGrid">${readOpts.map((x,i)=>`<button class="choice" data-read="${i}">${x}</button>`).join('')}</div><div id="readOut"></div></div></div>`;$$('[data-read]').forEach(b=>b.onclick=()=>{let ok=+b.dataset.read===readBest,read=ok?100:40,st=bstat(k);st.played++;st.hist.push(Math.round((exploit+read)/2));st.hist=st.hist.slice(-10);st.mastery=Math.round(st.hist.reduce((a,b)=>a+b,0)/st.hist.length);st.intel=Math.min(3,1+Math.floor(st.played/2));if(exploit>=67&&ok)st.w++;else st.l++;save();$('#readOut').innerHTML=`<h3 class="${ok?'green':'red'}">${ok?'READ 100.':'READ 40.'}</h3><p>${ok?'Ты не просто нажал хорошие кнопки — ты понял, почему именно против него.':'Решения могли быть приличными, но tendency ты пока не сформулировал.'}</p><div class="battleHistory">${st.hist.map((v,i)=>`<i class="${i===st.hist.length-1?'hot':''}" style="height:${Math.max(8,v/2)}px"></i>`).join('')}</div><div class="row"><span>MASTERY</span><b>${st.mastery}%</b></div><button id="battleAgain" class="primary">РЕВАНШ С ДРУГОЙ РУКОЙ →</button><button id="battleList" class="secondary">К СОПЕРНИКАМ</button>`;$('#battleAgain').onclick=()=>battleIntroV10(k);$('#battleList').onclick=renderBattle;$$('[data-read]').forEach(x=>x.disabled=true)})}

// -------- YOU: no fake scores, trends, clickable every leak, actionable today --------
function skillMetric(keys,min=6){let rows=keys.map(k=>S.concepts[k]).filter(Boolean),n=rows.reduce((a,c)=>a+c.n,0),g=rows.reduce((a,c)=>a+c.g,0),y=rows.reduce((a,c)=>a+c.y,0);return{n,score:n>=min?Math.round((g+.5*y)/n*100):null,need:Math.max(0,min-n)}}
function disciplineMetric(){let mem=S.healCourse.control?1:0,repeats=S.errors.filter(e=>e.tag==='river').length,confBad=S.confidence.filter(x=>!x.correct&&x.level===2).length,n=Math.max(1,S.played),score=Math.max(20,Math.min(95,70+mem*10-Math.min(30,repeats*3)-Math.min(15,confBad*3)));return{n:S.played,score:S.played>=8?score:null,need:Math.max(0,8-S.played)}}
function skillValsV10(){return{pre:skillMetric(['preflop']),post:skillMetric(['postflop']),size:{n:S.size.n,score:S.size.n>=5?Math.round(S.size.g/S.size.n*100):null,need:Math.max(0,5-S.size.n)},disc:disciplineMetric()}}
function leakFromConcept(key,name){let c=S.concepts[key];if(!c||c.n<3)return null;let sc=Math.round((c.g+.5*c.y)/c.n*100);return{key,name,score:sc,sample:c.n,bad:c.r,status:sc<45?'ЛЕЧИМ':sc<65?'НА КОНТРОЛЕ':'УЛУЧШАЕТСЯ'}}
function rankLeaks(){let arr=[leakFromConcept('bluff-catch','RIVER BLUFF-CATCH'),leakFromConcept('turn','TURN DECISIONS'),S.size.n>=3?{key:'sizing',name:'SIZING',score:Math.round(S.size.g/S.size.n*100),sample:S.size.n,bad:S.size.n-S.size.g,status:'НА КОНТРОЛЕ'}:null,leakFromConcept('bb-defense','BB DEFENCE')].filter(Boolean);return arr.sort((a,b)=>a.score-b.score)}
function sparkSvg(rows,key='skill'){let a=rows.filter(x=>x[key]!=null).slice(-14);if(a.length<2)return'<div class="skillEmpty">График появится, когда будет хотя бы два дня данных.</div>';let vals=a.map(x=>x[key]),min=Math.min(...vals),max=Math.max(...vals),den=max-min||1,pts=vals.map((v,i)=>`${15+i*(280/(a.length-1))},${78-(v-min)/den*58}`).join(' ');return`<svg class="spark" viewBox="0 0 310 90" preserveAspectRatio="none"><line class="grid" x1="10" y1="20" x2="300" y2="20"/><line class="grid" x1="10" y1="78" x2="300" y2="78"/><polyline points="${pts}"/>${vals.map((v,i)=>`<circle cx="${15+i*(280/(a.length-1))}" cy="${78-(v-min)/den*58}" r="4"/>`).join('')}</svg>`}
function metricCard(k,label,m){return`<button class="dnaBtn" data-vdna="${k}"><span class="ey">${label}</span><h2>${m.score==null?'—':m.score}</h2>${m.score==null?`<div class="sample">ещё ${m.need} решений до оценки</div><div class="sampleTrack"><span style="width:${Math.min(100,(m.n/(m.n+m.need||1))*100)}%"></span></div>`:`<div class="bar"><span style="width:${m.score}%"></span></div><div class="sample">${m.n} решений</div>`}</button>`}
function renderProfile(){let v=skillValsV10(),leaks=rankLeaks(),top=leaks[0],blind=S.confidence.filter(x=>!x.correct&&x.level===2).length;$('#profileArea').innerHTML=`<div class="hero"><span class="ey">YOU · ${S.nick||'REG'}</span><h1 class="impact">ТВОЁ<br><span class="pink">ПОКЕРНОЕ ДОСЬЕ.</span></h1><p>${S.played} решений · ${S.hands.length} своих раздач · ${S.dailyArchive.length} Daily.</p><p class="mut">${top?`Сейчас слабее всего выглядит ${top.name.toLowerCase()}. Хорошо: теперь хотя бы понятно, куда смотреть.`:'Сначала набери выборку. Я не ставлю диагноз по трём кликам.'}</p></div><div class="section"><div class="lab"><div class="ey">SKILL · ДИНАМИКА</div>${sparkSvg(S.snapshots,'skill')}<div class="row"><span>Сейчас</span><b>${S.skill}</b></div></div><h3>POKER DNA</h3><div class="dna">${metricCard('pre','PREFLOP',v.pre)}${metricCard('post','POSTFLOP',v.post)}${metricCard('size','SIZING',v.size)}${metricCard('disc','DISCIPLINE',v.disc)}</div><h3>🩺 ТВОИ ЛИКИ</h3>${leaks.length?leaks.slice(0,4).map((l,i)=>`<button class="row leakRow" data-leak-key="${l.key}"><div><div class="ey">${i===0?'ГЛАВНЫЙ · ':''}${l.status}</div><b>${l.name}</b><div class="mut small">${l.sample} решений · ${l.bad} плохих</div></div><b class="${l.score<45?'red':l.score<65?'yellow':'green'}">${l.score}</b></button>`).join(''):'<div class="skillEmpty">Пока нет достаточно данных для настоящего лика. И это лучше, чем придумать тебе диагноз ради красивой карточки.</div>'}<div class="lab"><div class="ey">УВЕРЕННОСТЬ</div><div class="row"><span>Ошибся и был уверен</span><b>${blind}</b></div><p class="mut small">Это самые интересные ошибки: человек не знает, что он не знает.</p></div><div class="lab"><div class="ey">ЧЕМ ГОРДИТЬСЯ</div>${S.healCourse.control?'<div class="row"><span>River bluff-catch</span><b class="green">контрольная ✓</b></div><p class="pink"><b>Один диагноз хотя бы перестал кричать. Не возвращай.</b></p>':'<p class="mut">Пока не буду выдавать медаль за существование. Исправленный навык появится здесь после реальной контрольной.</p>'}</div><button id="todayAction" class="todayCard" style="margin:10px 0;width:100%"><span class="ey">ЧТО ДЕЛАТЬ СЕГОДНЯ</span><b>${top?`Поднять ${top.name}`:'Набрать диагностическую выборку'}</b><span class="mut small">${top?.key==='sizing'?'5 задач на размер':top?.key==='river'?'микроупражнения на блефы / pot odds / блокеры':'10 решений в Swipe'}</span><span class="go">НАЧАТЬ →</span></button></div>`;$$('[data-vdna]').forEach(b=>b.onclick=()=>dnaInfoV10(b.dataset.vdna,v));$$('[data-leak-key]').forEach(b=>b.onclick=()=>leakDetailV10(b.dataset.leakKey));$('#todayAction').onclick=()=>{if(top?.key==='sizing'){show('sizing');renderSizing()}else if(top?.key==='river'){show('heal');renderHeal()}else{show('swipe');renderSwipe()}}}
function dnaInfoV10(k,v){let M=v[k],title={pre:'PREFLOP',post:'POSTFLOP',size:'SIZING',disc:'DISCIPLINE'}[k];if(M.score==null)return openModal(`<div class="ey">POKER DNA</div><h2>${title} · МАЛО ДАННЫХ</h2><p>Сейчас ${M.n} решений. Нужно ещё ${M.need}, прежде чем рисовать тебе умную цифру.</p><p class="pink"><b>Диагноз по трём кликам оставим другим приложениям.</b></p>`);let subs=k==='pre'?[['BTN/CO',skillMetric(['btn','co'],3)],['BB defence',skillMetric(['bb-defense'],3)],['ICM',skillMetric(['icm'],3)]]:k==='post'?[['Flop',skillMetric(['flop'],3)],['Turn',skillMetric(['turn'],3)],['River',skillMetric(['river'],3)]]:k==='size'?Object.entries(S.sizeCats).map(([n,c])=>[n,{n:c.n,score:Math.round((c.g+.5*c.y)/c.n*100)}]):[['Memory check',{n:S.healCourse.control?1:0,score:S.healCourse.control?100:0}],['Уверенные ошибки',{n:S.confidence.length,score:Math.max(0,100-S.confidence.filter(x=>!x.correct&&x.level===2).length*15)}]];openModal(`<div class="ey">POKER DNA</div><h2>${title} · ${M.score}</h2><p>${k==='disc'?'Показывает, применяешь ли уже разобранное и повторяешь ли старые ошибки.':'Цифра раскладывается на конкретные поднавыки — без мистики.'}</p><div class="miniBars">${subs.map(([n,m])=>`<div class="miniBar"><b>${n}</b><div class="track"><i style="width:${m.score??0}%"></i></div><b>${m.score==null?'—':m.score}</b></div>`).join('')}</div><p class="pink"><b>${k==='post'?'До ривера обычно культурно. Потом смотрим по фактам.':k==='size'?'Большая кнопка должна иметь аргумент, а не харизму.':'Теперь хотя бы понятно, откуда взялась цифра.'}</b></p>`)}
function leakDetailV10(key){let leaks=rankLeaks(),l=leaks.find(x=>x.key===key);if(!l)return;let es=key==='river'?S.errors.filter(e=>e.tag==='river'):key==='sizing'?S.errors.filter(e=>e.tag==='turn'):S.errors.filter(e=>e.tag===key);let trend=S.snapshots.slice(-7);openModal(`<div class="ey">ЛИК · ${l.status}</div><h2>${l.name} · ${l.score}</h2><div class="row"><span>Выборка</span><b>${l.sample} решений</b></div><div class="row"><span>Плохих</span><b>${l.bad}</b></div><p>${l.score<45?'Проблема повторяется достаточно часто, чтобы это уже было не «ну бывает».':'Пока это скорее зона контроля, чем диагноз.'}</p>${sparkSvg(trend,key==='sizing'?'size':key==='river'?'post':'pre')}<h3>УЛИКИ</h3>${es.length?es.slice(0,6).map(e=>`<div class="lab"><b>${e.hand} · ${e.street}</b><p>${e.why}</p></div>`).join(''):'<p class="mut">Конкретных сохранённых рук пока мало.</p>'}${key==='river'?'<button id="modalHeal" class="primary">ЛЕЧИТЬ →</button>':''}`);if($('#modalHeal'))$('#modalHeal').onclick=()=>{$('#modal').classList.add('hidden');show('heal');renderHeal()}}

// Keep state persisted after migration.
save();

ui();
});
</script></body></html>
