<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>Poker Swipe</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg:#080808;--panel:#151515;--panel2:#1d1d1d;--text:#f5f5f5;
      --muted:#a9a9a9;--red:#e21d34;--line:#2b2b2b;--good:#4cd57b;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at top,rgba(226,29,52,.17),transparent 32%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    button{font:inherit}
    .app{width:min(100%,520px);margin:0 auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
    .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:850}
    .logo{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--red)}
    .stats{display:flex;gap:8px;font-size:14px;color:var(--muted)}
    .pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 10px}
    .track{height:8px;background:#222;border-radius:999px;overflow:hidden;margin-bottom:16px}
    .bar{height:100%;width:0;background:var(--red);transition:width .25s ease}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 45%),var(--panel);border:1px solid var(--line);border-radius:24px;padding:22px;min-height:455px;touch-action:pan-y;transition:transform .2s ease,opacity .2s ease}
    .tag{display:inline-flex;padding:7px 10px;border-radius:999px;background:rgba(226,29,52,.13);border:1px solid rgba(226,29,52,.4);font-size:13px;margin-bottom:16px}
    .hand{display:flex;justify-content:center;gap:12px;margin:8px 0 22px}
    .pcard{width:92px;height:126px;border-radius:14px;background:#f7f7f4;color:#111;padding:10px;font-size:30px;font-weight:900;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 15px 30px rgba(0,0,0,.35)}
    .pcard.red{color:#c6172c}.suit{align-self:flex-end;font-size:35px}
    .situation{text-align:center;font-size:21px;line-height:1.35;max-width:380px;margin:0 auto}
    .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
    .meta div{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 7px;text-align:center}
    .meta span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
    .hint{text-align:center;color:var(--muted);font-size:13px}
    .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
    .action,.next,.restart{min-height:52px;border-radius:16px;font-weight:800}
    .action{background:var(--panel);color:var(--text);border:1px solid var(--line)}
    .action.raise,.next,.restart{background:var(--red);color:white;border:0}
    .feedback{display:none;margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}
    .feedback.show{display:block}.feedback.good .ftitle{color:var(--good)}.feedback.bad .ftitle{color:var(--red)}
    .ftitle{font-size:21px;font-weight:850}.feedback p{line-height:1.45}
    .joke{color:var(--muted);font-style:italic;border-left:3px solid var(--red);padding-left:12px}
    .next,.restart{width:100%;margin-top:10px}
    .finish{display:none;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px 22px}
    .finish.show{display:block}.score{font-size:56px;font-weight:900;color:var(--red);margin:16px 0}
    .finish p{color:var(--muted);line-height:1.5}
    .fly-left{transform:translateX(-120%) rotate(-9deg);opacity:0}.fly-right{transform:translateX(120%) rotate(9deg);opacity:0}.fly-up{transform:translateY(-110%) scale(.95);opacity:0}
    @media(max-width:390px){.pcard{width:78px;height:110px;font-size:25px}.suit{font-size:29px}.card{min-height:430px;padding:18px}.situation{font-size:19px}}
  </style>
</head>
<body>
<main class="app">
  <div class="top">
    <div class="brand"><div class="logo">♠</div><div>Poker Swipe</div></div>
    <div class="stats"><div class="pill">✅ <span id="scoreTop">0</span></div><div class="pill">⚡ <span id="xpTop">0</span> XP</div></div>
  </div>

  <section id="game">
    <div class="track"><div class="bar" id="bar"></div></div>
    <article class="card" id="card">
      <div class="tag">Префлоп</div>
      <div class="hand" id="hand"></div>
      <div class="situation" id="situation"></div>
      <div class="meta">
        <div><span>Позиция</span><strong id="position"></strong></div>
        <div><span>Стек</span><strong id="stack"></strong></div>
        <div><span>Формат</span><strong id="format"></strong></div>
      </div>
      <div class="hint">← фолд · ↑ колл · → рейз</div>
    </article>

    <div class="actions" id="actions">
      <button class="action" data-answer="fold">← Фолд</button>
      <button class="action" data-answer="call">↑ Колл</button>
      <button class="action raise" data-answer="raise">Рейз →</button>
    </div>

    <section class="feedback" id="feedback">
      <div class="ftitle" id="ftitle"></div>
      <p id="explanation"></p>
      <p class="joke" id="joke"></p>
      <button class="next" id="next">Следующая рука</button>
    </section>
  </section>

  <section class="finish" id="finish">
    <h1>Сессия закончена</h1>
    <div class="score" id="finalScore"></div>
    <p id="finalText"></p>
    <button class="restart" id="restart">Сыграть ещё раз</button>
  </section>
</main>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();tg.setHeaderColor?.("#080808");tg.setBackgroundColor?.("#080808")}

const questions=[
{cards:["A♠","Q♦"],position:"BTN",stack:"40 BB",format:"MTT",situation:"До тебя все сфолдили. Что делаешь?",correct:"raise",explanation:"С баттона открывают широкий диапазон. AQo — сильная рука, стандартно играем рейзом.",joke:"AQ — не бывший. На баттоне ему можно доверять."},
{cards:["K♣","7♦"],position:"UTG",stack:"50 BB",format:"MTT",situation:"Ты первый говоришь за полным столом.",correct:"fold",explanation:"K7o слишком слабая рука для ранней позиции: впереди много игроков, а сильные короли часто будут доминировать.",joke:"K7o выглядит смело только до момента, когда кто-то показывает KQ."},
{cards:["J♠","J♥"],position:"CO",stack:"35 BB",format:"MTT",situation:"Игрок из MP открыл 2.2 BB. До тебя все сфолдили.",correct:"raise",explanation:"JJ достаточно сильны для 3-бета на вэлью. Колл возможен, но базовое решение для новичка — рейз.",joke:"Валеты любят драму, но это не повод играть их пассивно."},
{cards:["A♥","9♣"],position:"UTG",stack:"30 BB",format:"MTT",situation:"Ты открываешь торговлю за столом 9-max.",correct:"fold",explanation:"A9o часто попадает под доминацию более сильных тузов. Из ранней позиции эту руку лучше выбрасывать.",joke:"Красивый туз, сложный характер, дорогая терапия."},
{cards:["8♠","8♦"],position:"BTN",stack:"25 BB",format:"MTT",situation:"До тебя все сфолдили.",correct:"raise",explanation:"Карманная пара на баттоне — уверенное открытие. Мы хотим забирать блайнды или играть банк в позиции.",joke:"Пара восьмерок уже серьёзнее половины знакомств в Telegram."},
{cards:["A♣","K♣"],position:"SB",stack:"45 BB",format:"MTT",situation:"BTN открыл 2.3 BB. Твой ход.",correct:"raise",explanation:"AKs — премиальная рука. Из малого блайнда лучше 3-бетить, а не заходить коллом без позиции.",joke:"Здесь можно проявляться первой. Редкий случай, когда это точно не унизительно."},
{cards:["Q♠","9♠"],position:"BB",stack:"40 BB",format:"MTT",situation:"BTN открыл 2 BB, малый блайнд сфолдил.",correct:"call",explanation:"Q9s хорошо защищает большой блайнд против маленького открытия с баттона: хорошие шансы банка и приличная играбельность.",joke:"Не каждый колл — эмоциональная зависимость. Иногда у тебя просто хорошие пот-оддсы."},
{cards:["A♦","A♣"],position:"HJ",stack:"60 BB",format:"MTT",situation:"До тебя все сфолдили.",correct:"raise",explanation:"Тузы — сильнейшая стартовая рука. Лимп скрывает силу, но обычно теряет вэлью и приглашает лишних игроков.",joke:"Редкий профиль, где красных флагов действительно нет."},
{cards:["6♥","5♥"],position:"UTG",stack:"18 BB",format:"MTT",situation:"Ты первый говоришь за полным столом.",correct:"fold",explanation:"При коротком стеке одномастные коннекторы теряют ценность: мало пространства для манёвра и недостаточно глубокие имплайды.",joke:"Красивые перспективы требуют глубоких стеков. Как и большинство сомнительных отношений."},
{cards:["K♠","Q♠"],position:"CO",stack:"32 BB",format:"MTT",situation:"Игрок UTG открыл 2.2 BB, остальные сфолдили.",correct:"call",explanation:"KQs достаточно сильная и играбельная рука для колла в позиции. 3-бет возможен, но базовый спокойный выбор — колл.",joke:"Иногда не надо форсировать события. Даже у Фриковой дамы бывает здоровый колл."}
];

let i=0,score=0,xp=0,answered=false,startX=0,startY=0,dragging=false;
const el=id=>document.getElementById(id);
const card=el("card"),hand=el("hand"),feedback=el("feedback"),actions=el("actions");

function cardHTML(t){const r=t[0],s=t.slice(1),red=s==="♥"||s==="♦";return `<div class="pcard ${red?"red":""}"><span>${r}</span><span class="suit">${s}</span></div>`}
function render(){
  answered=false; const q=questions[i];
  hand.innerHTML=q.cards.map(cardHTML).join("");
  el("situation").textContent=q.situation;el("position").textContent=q.position;el("stack").textContent=q.stack;el("format").textContent=q.format;
  el("bar").style.width=`${(i/questions.length)*100}%`;feedback.className="feedback";actions.style.display="grid";card.className="card";card.style.transform="";
}
function answer(choice,anim){
  if(answered)return;answered=true;const q=questions[i],ok=choice===q.correct;
  if(anim){card.classList.add(anim);setTimeout(()=>card.classList.remove(anim),220)}
  if(ok){score++;xp+=20;feedback.className="feedback show good";el("ftitle").textContent="MATCH ❤️  +20 XP"}
  else{xp+=5;feedback.className="feedback show bad";el("ftitle").textContent="RED FLAG 🚩  +5 XP"}
  el("explanation").textContent=q.explanation;el("joke").textContent=q.joke;el("scoreTop").textContent=score;el("xpTop").textContent=xp;actions.style.display="none";
  tg?.HapticFeedback?.notificationOccurred(ok?"success":"error");
}
document.querySelectorAll(".action").forEach(b=>b.addEventListener("click",()=>{const a=b.dataset.answer;answer(a,a==="fold"?"fly-left":a==="raise"?"fly-right":"fly-up")}));
el("next").addEventListener("click",()=>{i++;i>=questions.length?finish():render()});
function finish(){
  el("game").style.display="none";el("finish").classList.add("show");el("finalScore").textContent=`${score}/${questions.length}`;
  const p=score/questions.length;
  el("finalText").textContent=p>=.9?"Ты уже опасна для домашней игры. Осталось не начать объяснять всем диапазоны.":p>=.7?"Крепкий результат. Несколько красных флагов ещё не распознаны.":p>=.5?"База есть. Банкролл пока лучше держать под присмотром.":"Не страшно. Зато регуляры уже почувствовали приток ликвидности.";
}
el("restart").addEventListener("click",()=>{i=0;score=0;xp=0;el("scoreTop").textContent="0";el("xpTop").textContent="0";el("finish").classList.remove("show");el("game").style.display="block";render()});

card.addEventListener("pointerdown",e=>{if(answered)return;dragging=true;startX=e.clientX;startY=e.clientY;card.setPointerCapture(e.pointerId)});
card.addEventListener("pointermove",e=>{if(!dragging||answered)return;const dx=e.clientX-startX,dy=e.clientY-startY;card.style.transform=`translate(${dx*.55}px,${dy*.35}px) rotate(${dx*.025}deg)`});
card.addEventListener("pointerup",e=>{if(!dragging||answered)return;dragging=false;const dx=e.clientX-startX,dy=e.clientY-startY;card.style.transform="";
  if(Math.abs(dx)>85&&Math.abs(dx)>Math.abs(dy))answer(dx>0?"raise":"fold",dx>0?"fly-right":"fly-left");
  else if(dy<-85)answer("call","fly-up");
});
render();
</script>
</body>
</html>
