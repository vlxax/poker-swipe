<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080c">
<title>POKER SWIPE — V14.4 SWIPE + XRAY</title>
<style>
:root{
  --bg:#08080c;--panel:#121219;--panel2:#17171f;--line:#30303a;--text:#faf8fa;
  --mut:#98939f;--pink:#ff2e84;--pink2:#ff6aac;--g:#42e786;--y:#ffd257;--r:#ff4b68;
  --safe:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}
body{min-height:100vh}.app{max-width:480px;margin:0 auto;min-height:100vh;background:
radial-gradient(circle at 55% -10%,#ff2e841d,transparent 34%),var(--bg);position:relative}
button,input{font:inherit}button{color:inherit}.hidden{display:none!important}
.screen{display:none;padding:10px 0 calc(95px + var(--safe))}.screen.active{display:block}
.top{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;
background:linear-gradient(#08080cf4,#08080ccb,transparent);backdrop-filter:blur(10px)}
.brand{font-weight:950;letter-spacing:-.04em}.pink{color:var(--pink)}.green{color:var(--g)}.yellow{color:var(--y)}.red{color:var(--r)}
.mut{color:var(--mut)}.small{font-size:12px}.ey{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);font-weight:900}
.chip{border:1px solid var(--line);background:#121217;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900}
.impact{font-weight:1000;letter-spacing:-.06em;text-transform:uppercase}
h1,h2,h3,p{margin-top:0}h1{font-size:38px;line-height:.88}h2{letter-spacing:-.04em}
.hero,.panel,.lab{margin:0 14px 12px;border:1px solid var(--line);border-radius:26px;padding:18px;background:
radial-gradient(circle at 80% 0,#ff2e8418,transparent 34%),linear-gradient(160deg,#18181f,#0e0e13)}
.section{padding:0 14px;margin-top:16px}.section h3{font-size:12px;letter-spacing:.11em;color:#c3bec8}
.primary,.secondary,.choice,.action{
width:100%;border:0;border-radius:16px;padding:14px 14px;font-weight:950;margin-top:8px}
.primary{background:var(--pink);color:white;box-shadow:0 10px 28px #ff2e8428}
.secondary{background:#15151c;border:1px solid #373741}.choice{background:#121219;border:1px solid #363640}
.choice.selected{border-color:var(--pink);box-shadow:0 0 20px #ff2e842b}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:0 14px}
.tile{min-height:154px;border:1px solid var(--line);border-radius:23px;background:#15151b;padding:15px;text-align:left;position:relative;overflow:hidden}
.tile b{display:block;font-size:18px;line-height:1}.tile .go{position:absolute;right:13px;bottom:12px;color:var(--pink);font-weight:950}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:0 14px 11px}
.metric{background:#101015;border:1px solid #2c2c35;border-radius:18px;padding:11px;text-align:left}
.metric b{display:block;font-size:24px;margin:4px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #25252d;padding:11px 0}
.bar{height:8px;background:#25252d;border-radius:99px;overflow:hidden}.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--pink2))}
.nav{position:fixed;z-index:50;left:50%;bottom:0;transform:translateX(-50%);width:min(480px,100%);display:grid;grid-template-columns:repeat(4,1fr);
padding:9px 8px calc(9px + var(--safe));background:#0b0b0ff5;border-top:1px solid #26262d;backdrop-filter:blur(14px)}
.nav button{border:0;background:transparent;color:#6f6a75;font-size:10px;font-weight:900;padding:8px 3px}.nav button i{display:block;font-style:normal;font-size:20px;margin-bottom:3px}
.nav button.on{color:#fff}.nav button.on i{color:var(--pink)}
.cards{display:flex;gap:7px;justify-content:center;margin:14px 0}.pc{width:50px;height:69px;border-radius:10px;background:#f6f6f7;color:#111;display:grid;place-items:center;font-size:20px;font-weight:1000;box-shadow:0 8px 20px #0007}
.suit-red{color:#d91536}
.actions{position:sticky;bottom:76px;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 14px;background:linear-gradient(transparent,#08080cf5 28%)}
.action{margin:0;padding:15px 6px;background:#15151b;border:1px solid #3a3a45}.action.fold{border-color:#ff4b6855}.action.call{border-color:#ffd25755}.action.raise{border-color:#42e78655}
.verdict{margin:10px 14px;border:1px solid #383843;border-radius:20px;padding:15px;background:#101015}
.onboard{min-height:100vh;display:grid;place-items:center;padding:26px}.story{width:100%;border:2px solid #09090d;border-radius:30px;padding:25px;background:
radial-gradient(circle at 80% 20%,#ff2e8429,transparent 32%),linear-gradient(150deg,#f5eff3,#e8dfe5);color:#111;box-shadow:0 22px 80px #0008}
.story h1{font-size:44px}.story input{width:100%;border:2px solid #111;border-radius:16px;background:white;padding:14px;font-size:18px;margin:10px 0}
.story .primary{border:2px solid #111}.tap{margin-top:14px;font-weight:900;color:#5d5058}
.build{position:fixed;right:8px;top:8px;z-index:999;background:var(--pink);border:2px solid #08080c;border-radius:999px;padding:6px 8px;font-size:9px;font-weight:950}

/* HOME DISTINCT MODES */
.dailyTile{grid-column:1/-1;min-height:210px;background:radial-gradient(circle at 70% 35%,#1d4631,#101714 46%,#121218 78%)}
.dailyBoard{display:flex;gap:4px;margin-top:16px}.dailyBoard span{width:37px;height:51px;background:#f5f5f6;color:#111;border-radius:8px;display:grid;place-items:center;font-weight:950}
.sizingTile{background:radial-gradient(circle at 85% 10%,#ff2e8430,transparent 34%),#15151b}.chipsPreview{height:47px;display:flex;gap:1px;align-items:flex-end;margin-top:10px}.chipsPreview i{width:30px;height:8px;border:2px solid var(--pink);border-radius:50%;background:#25131c;margin-right:-12px}
.csiPreview{border-left:2px solid #484852;padding-left:11px;margin-top:11px;font-size:9px;line-height:15px}.xrayTile{background:radial-gradient(circle at 40% 40%,#6b214938,transparent 42%),#15151b}
.miniGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:105px;margin-top:10px}.miniGrid i{aspect-ratio:1;border-radius:2px;background:#51213b}.miniGrid i:nth-child(4n){opacity:.24}
.quick5{margin:10px 14px;border:1px solid #393943;border-radius:20px;background:#111116;padding:14px;display:flex;justify-content:space-between;text-align:left;width:calc(100% - 28px)}.quick5 strong{font-size:25px}

/* SIZING */
.table{height:185px;border:8px solid #141419;border-radius:50%;background:radial-gradient(ellipse,#173124,#0d1611 68%);position:relative;margin:14px 0;box-shadow:inset 0 0 35px #000}
.pot{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center}.pot b{font-size:30px;display:block}
.stack{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;align-items:end;height:55px}.stack i{width:31px;height:8px;border:2px solid var(--pink);background:#27131d;border-radius:50%;margin-left:-16px}
.range{width:100%;accent-color:var(--pink)}.scale{display:flex;justify-content:space-between;color:var(--mut);font-size:9px}.sizeRead{display:flex;justify-content:space-between;align-items:end}.sizeRead b{font-size:36px}

/* REVIEW */
.timeline{position:relative;padding-left:31px}.timeline:before{content:"";position:absolute;left:12px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--g),var(--y),var(--r))}
.node{position:relative;width:100%;text-align:left;border:1px solid #31313b;background:#0f0f14;border-radius:16px;padding:11px;margin:8px 0}
.node:before{content:"";position:absolute;left:-25px;top:17px;width:11px;height:11px;border-radius:50%;background:#76717b;border:3px solid #111}
.node.selected{border-color:var(--pink);transform:translateX(5px);box-shadow:0 0 22px #ff2e8427}.node.good{border-color:#42e78666}.node.warn{border-color:#ffd25766}.node.bad{border-color:#ff4b6888}
.evidence{display:grid;grid-template-columns:1fr 1fr;gap:7px}.evidence button{border:1px solid #33333d;background:#111116;border-radius:15px;padding:12px;text-align:left}

/* DAILY */
.dailyStage{min-height:430px;background:radial-gradient(circle at 50% 42%,#173226,#0c1511 34%,#0a0a0e 70%)}.streetDots{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}
.streetDots span{border:1px solid #2e2e38;border-radius:999px;text-align:center;padding:7px;font-size:9px;color:#68636d}.streetDots span.on{color:#fff;border-color:var(--pink)}.streetDots span.done{color:var(--g)}
.argBoard{display:grid;grid-template-columns:1fr 1fr;gap:10px}.drop{min-height:150px;border:1px dashed #464650;border-radius:20px;padding:10px}.token{display:inline-block;border:1px solid #3c3c46;background:#17171d;border-radius:11px;padding:9px;margin:4px;font-size:11px;font-weight:900}

/* HEAL */
.healMap{margin-top:10px}.healStep{display:grid;grid-template-columns:46px 1fr 42px;gap:9px;align-items:center;padding:12px 0;position:relative}.orb{width:44px;height:44px;border:1px solid #464651;border-radius:50%;display:grid;place-items:center;font-weight:950}.healStep.done .orb{border-color:var(--g);box-shadow:0 0 16px #42e78633}
.sortGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bucket{min-height:160px;border:1px dashed #44444e;border-radius:18px;padding:10px}.bucket.value{border-color:#42e78666}.bucket.bluff{border-color:#ff4b6866}

/* MY HANDS */
.pokerDesk{height:225px;border:8px solid #16161c;border-radius:48%;background:radial-gradient(ellipse,#173124,#0c1510 68%);position:relative;margin:15px 0}.seat{position:absolute;border:1px solid #3b3b46;border-radius:999px;background:#101015;padding:7px 9px;font-size:9px;font-weight:950}.seat.on{border-color:var(--pink);box-shadow:0 0 18px #ff2e8433}.seat:nth-child(1){left:50%;top:-13px;transform:translateX(-50%)}.seat:nth-child(2){right:-9px;top:52px}.seat:nth-child(3){right:15px;bottom:-10px}.seat:nth-child(4){left:15px;bottom:-10px}.seat:nth-child(5){left:-9px;top:52px}.seat:nth-child(6){left:50%;bottom:15px;transform:translateX(-50%)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.formgrid input,.formgrid select{width:100%;background:#111116;color:white;border:1px solid #363640;border-radius:13px;padding:11px}
.handTimeline{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.streetBox{background:#101015;border:1px solid #303039;border-radius:15px;padding:10px}.streetBox .potbar{width:100%;background:var(--pink);border-radius:99px;margin-top:8px}

/* XRAY */
.xrStage{margin:0 14px 12px;border:1px solid #34343f;border-radius:30px;padding:18px;background:
radial-gradient(circle at 55% 18%,#ff2e8421,transparent 34%),radial-gradient(circle at 50% 62%,#45ffbc0d,transparent 42%),linear-gradient(165deg,#17171e,#09090d 75%);position:relative;overflow:hidden}
.xrStage:before{content:"";position:absolute;left:-20%;right:-20%;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--pink),white,var(--pink),transparent);box-shadow:0 0 18px var(--pink);animation:scan 4s ease-in-out infinite}@keyframes scan{50%{transform:translateY(520px);opacity:.45}}
.xrGrid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:3px;user-select:none;touch-action:none}.xrCell{aspect-ratio:1;border:1px solid #2b2b35;background:#101015;border-radius:4px;color:#7d7781;font-size:6px;font-weight:950;padding:0}.xrCell.alive{background:#25131c;border-color:#70304e;color:#ffe7f1}.xrCell.keep{background:#632342;border-color:var(--pink);color:#fff;box-shadow:0 0 8px #ff2e8437}.xrCell.dead{opacity:.1;pointer-events:none}
.xrProg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:11px 0}.xrProg span{border:1px solid #2e2e37;border-radius:999px;padding:7px 3px;text-align:center;font-size:8px;color:#66616b}.xrProg .on{border-color:var(--pink);color:#fff}.xrProg .done{border-color:#42e78655;color:var(--g)}
.funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.funnel div{border:1px solid #303039;border-radius:14px;background:#0f0f14;padding:9px;text-align:center}.funnel b{font-size:21px;display:block}
.balance{display:grid;grid-template-columns:1fr 1fr;gap:9px}.col{min-height:155px;border:1px solid #303039;border-radius:18px;padding:11px}.col.v{border-color:#42e78655}.col.b{border-color:#ff4b6855}
.shareCard{background:linear-gradient(145deg,#28121d,#111116);border:1px solid #5c2941;border-radius:22px;padding:17px;text-align:center}.shareCard .big{font-size:37px;font-weight:1000}

/* YOU */
.dna{height:285px;position:relative;border:1px solid #292933;border-radius:28px;background:radial-gradient(circle,#191922,#0d0d12 70%);margin:12px 0}.dnaCore{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;border:1px solid var(--pink);background:#171219;display:grid;place-items:center;text-align:center;box-shadow:0 0 34px #ff2e8427}.skillNode{position:absolute;width:84px;height:84px;border-radius:50%;border:1px solid #383842;background:#101015;font-size:9px;font-weight:950}.skillNode b{display:block;font-size:21px}.skillNode.n1{left:15px;top:22px}.skillNode.n2{right:15px;top:22px}.skillNode.n3{left:15px;bottom:22px}.skillNode.n4{right:15px;bottom:22px}.skillNode.leak{border-color:var(--r);box-shadow:0 0 23px #ff4b6835}
.scrub{width:100%;accent-color:var(--pink)}
.modal{position:fixed;z-index:100;inset:0;background:#000a;display:grid;align-items:end}.sheet{max-width:480px;width:100%;margin:auto;background:#111116;border:1px solid #34343e;border-radius:28px 28px 0 0;padding:18px 16px 30px}.close{float:right;border:0;background:#22222a;color:white;border-radius:50%;width:34px;height:34px}
@media(max-width:380px){h1{font-size:33px}.xrCell{font-size:5px}.pc{width:44px;height:62px}}

/* ===== V14.4 SWIPE UX ===== */
.swipeShell{margin:0 14px 12px;position:relative}
.swipeTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.swipeProgress{height:5px;background:#24242d;border-radius:99px;overflow:hidden;margin:0 0 10px}.swipeProgress span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--pink2));transition:width .25s}
.swipeCardV{border:1px solid var(--line);border-radius:27px;padding:18px;background:radial-gradient(circle at 78% 6%,#ff2e841b,transparent 35%),linear-gradient(160deg,#18181f,#0e0e13);transition:transform .24s,opacity .24s;min-height:330px}
.swipeCardV.out{transform:translateX(-24px) rotate(-1deg);opacity:0}.swipeCardV.in{animation:swIn .25s ease-out}@keyframes swIn{from{transform:translateX(24px);opacity:.1}to{transform:none;opacity:1}}
.swipeContext{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.swipeContext div{border:1px solid #2f2f38;background:#101015;border-radius:13px;padding:9px}.swipeContext b{display:block;font-size:13px}
.swipeThink{font-variant-numeric:tabular-nums}.swipeHint{margin:9px 0 0;color:var(--mut);font-size:11px}
.action{position:relative;transition:transform .13s,border-color .13s,background .13s,box-shadow .13s,opacity .13s}.action:active{transform:scale(.97)}
.action.selected{transform:translateY(-3px);color:white!important;opacity:1!important}.action.selected.grade-g{background:#143623;border-color:var(--g);box-shadow:0 0 0 2px #42e78638,0 0 26px #42e78633}.action.selected.grade-y{background:#382e12;border-color:var(--y);box-shadow:0 0 0 2px #ffd25730,0 0 26px #ffd25722}.action.selected.grade-r{background:#3c1720;border-color:var(--r);box-shadow:0 0 0 2px #ff4b6835,0 0 26px #ff4b6828}.action:disabled:not(.selected){opacity:.32}
.swipeFlash{margin:10px 0 0;border-radius:17px;padding:12px;border:1px solid #34343e;background:#0e0e13}.swipeFlash h3{margin:3px 0 6px}.swipeReport{margin:0 14px;border:1px solid #393944;border-radius:28px;padding:20px;background:radial-gradient(circle at 70% 10%,#ff2e8422,transparent 34%),#111116}.swipeReportGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:13px 0}.swipeReportGrid div{border:1px solid #303039;border-radius:15px;padding:11px;text-align:center}.swipeReportGrid b{display:block;font-size:24px}
.xrChoiceBar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:10px 0}.xrCountLive{font-size:28px;font-weight:1000}.xrRule{border-left:3px solid var(--pink);padding-left:10px;margin:11px 0}.xrCell.removed{opacity:.12!important;transform:scale(.88)}
</style>
</head>
<body>
<div class="app">
<div class="build">V14.4 · SWIPE+XRAY</div>

<section id="onboarding" class="onboard"><div id="story" class="story"></div></section>

<div id="mainApp" class="hidden">
<header class="top"><div><div class="brand">POKER <span class="pink">SWIPE</span></div><div id="hello" class="mut small"></div></div><div class="chip" id="levelChip">SKILL 50</div></header>
<main>
<section id="home" class="screen active"></section>
<section id="swipe" class="screen"><div id="swipeCard"></div><div id="swipeVerdict" class="verdict hidden"></div><div class="actions" id="swipeActions"></div></section>
<section id="sizing" class="screen"><div id="sizingArea"></div></section>
<section id="review" class="screen"><div id="reviewArea"></div></section>
<section id="daily" class="screen"><div id="dailyArea"></div></section>
<section id="heal" class="screen"><div id="healArea"></div></section>
<section id="myhands" class="screen"><div id="myArea"></div></section>
<section id="xray" class="screen"><div id="xrayArea"></div></section>
<section id="profile" class="screen"><div id="profileArea"></div></section>
</main>
<nav class="nav">
<button class="on" data-nav="home"><i>⌂</i>PLAY</button>
<button data-nav="myhands"><i>🃏</i>МОИ</button>
<button data-nav="xray"><i>◎</i>РЕНТГЕН</button>
<button data-nav="profile"><i>◎</i>YOU</button>
</nav>
</div>

<div id="modal" class="modal hidden"><div class="sheet"><button class="close" id="modalClose">×</button><div id="modalBody"></div></div></div>
</div>

<script>
document.addEventListener('DOMContentLoaded',()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const today=()=>new Date().toISOString().slice(0,10);
const STORAGE='pokerSwipeV14_4';
const LEGACY_STORAGE=['pokerSwipeV14_3_stable','pokerSwipeV14_2_compat','pokerSwipeV14_1_clean'];

const DEFAULT_STATE={
  version:'14.4',nick:'',onboarded:false,diagDone:false,skill:50,played:0,good:0,mid:0,bad:0,streak:0,lastDay:'',
  skills:{pre:{g:0,n:0},post:{g:0,n:0},sizing:{g:0,n:0},discipline:55},
  errors:[],hands:[],dailyArchive:[],snapshots:[],confidence:[],
  heal:{bluffs:0,pot:0,blocker:0,control:false},
  xray:{runs:0,pre:0,narrow:0,river:0,blockers:0,best:0,history:[]}
};
function mergeState(raw){
  const s=JSON.parse(JSON.stringify(DEFAULT_STATE));
  if(!raw||typeof raw!=='object')return s;
  Object.assign(s,raw);
  s.skills={...DEFAULT_STATE.skills,...(raw.skills||{})};
  s.skills.pre={...DEFAULT_STATE.skills.pre,...(raw.skills?.pre||{})};
  s.skills.post={...DEFAULT_STATE.skills.post,...(raw.skills?.post||{})};
  s.skills.sizing={...DEFAULT_STATE.skills.sizing,...(raw.skills?.sizing||{})};
  s.heal={...DEFAULT_STATE.heal,...(raw.heal||{})};
  s.xray={...DEFAULT_STATE.xray,...(raw.xray||{})};
  s.errors=Array.isArray(raw.errors)?raw.errors:[];
  s.hands=Array.isArray(raw.hands)?raw.hands:[];
  s.dailyArchive=Array.isArray(raw.dailyArchive)?raw.dailyArchive:[];
  s.snapshots=Array.isArray(raw.snapshots)?raw.snapshots:[];
  s.confidence=Array.isArray(raw.confidence)?raw.confidence:[];
  return s
}
let S;
function loadSavedState(){
  try{
    let raw=localStorage.getItem(STORAGE);
    if(!raw){for(const key of LEGACY_STORAGE){raw=localStorage.getItem(key);if(raw)break}}
    return mergeState(raw?JSON.parse(raw):null)
  }catch(e){return mergeState(null)}
}
S=loadSavedState();
function save(){
  try{localStorage.setItem(STORAGE,JSON.stringify(S))}catch(e){}
  ui()
}
function ui(){
  const hello=$('#hello'), level=$('#levelChip');
  if(hello) hello.textContent=S.nick?`Привет, ${S.nick}`:'';
  if(level) level.textContent=`SKILL ${S.skill}`;
}
function snapshot(){
  const d=today(),last=S.snapshots[S.snapshots.length-1];
  const row={date:d,skill:S.skill,form:formScore()};
  if(last?.date===d)S.snapshots[S.snapshots.length-1]=row;else S.snapshots.push(row);
  S.snapshots=S.snapshots.slice(-90)
}
function touchDay(){
  const d=today();
  if(S.lastDay!==d){S.streak=(S.lastDay?S.streak+1:1);S.lastDay=d}
}
function recordResult(grade,skillKey,why,hand){
  S.played++; if(grade==='g')S.good++;else if(grade==='y')S.mid++;else S.bad++;
  const bucket=skillKey==='pre'?S.skills.pre:skillKey==='sizing'?S.skills.sizing:S.skills.post;
  if(bucket){bucket.n++; if(grade==='g')bucket.g++}

}

   ['AA','KK','88','44','33','AKs','AQs','A8s','QJs','QTs','JTs','T9s']
  ],
  river:[['AA','V'],['KK','V'],['88','V'],['44','V'],['33','V'],['AKs','V'],['AQs','V'],['A8s','V'],['QJs','B'],['QTs','B'],['JTs','B'],['T9s','B']],
  need:6,block:{beforeV:16,beforeB:7,afterV:14,afterB:3,text:'J♦ режет часть QJ/JT блефов. Для bluff-catch это плохой обмен.'}
 },
 {title:'BVB · ПОЛЯРНЫЙ РИВЕР',villain:'SB · 55 BB',hero:['Q♠','8♥'],board:['Q♣','7♦','2♠','5♣','K♥'],counts:[286,196,91,31],
  line:['SB открыл 3 BB','Q♣7♦2♠ · SB 33%','5♣ · SB 80%','K♥ · SB 150%'],
  ref:[
   ['AA','KK','QQ','JJ','TT','99','88','77','66','55','44','33','22','AKs','AQs','AJs','ATs','A9s','A8s','A7s','A6s','A5s','A4s','A3s','A2s','KQs','KJs','KTs','K9s','K8s','QJs','QTs','Q9s','Q8s','JTs','J9s','T9s','T8s','98s','87s','76s','65s','54s','AKo','AQo','AJo','ATo','KQo','KJo','KTo','QJo','QTo','JTo'],
   ['AA','KK','QQ','JJ','TT','99','77','55','22','AKs','AQs','AJs','ATs','A5s','KQs','KJs','QJs','QTs','Q9s','Q8s','JTs','T9s','98s','87s','76s','65s','54s','AKo','AQo','KQo','QJo'],
   ['AA','KK','QQ','77','55','22','AKs','AQs','A5s','KQs','KJs','QJs','QTs','JTs','T9s','87s','76s','65s','54s','AKo','AQo','KQo'],
   ['KK','QQ','77','55','22','AKs','KQs','KJs','A5s','JTs','T9s','87s']
  ],
  river:[['KK','V'],['QQ','V'],['77','V'],['55','V'],['22','V'],['AKs','V'],['KQs','V'],['KJs','V'],['A5s','B'],['JTs','B'],['T9s','B'],['87s','B']],
  need:7,block:{beforeV:17,beforeB:8,afterV:16,afterB:5,text:'Q♠ почти не режет новую Kx-value часть, но может убрать часть Qx-блефов.'}
 }
];
let xrScenario=0,xrStage=0,xrCurrent=new Set(),xrCandidate=new Set(),xrScores={pre:0,narrow:0,river:0,blockers:0},xrClass={};
const XR_DECOYS=['K7o','Q8o','J7o','T6s','96s','85s','74s','63s','52s','K6o','Q7o','J8o','T7o','95s','84s'];
function xkey(r,c){const a=R[r],b=R[c];return r===c?a+a:r<c?a+b+'s':b+a+'o'}
function xrRef(stage){return new Set(XR_SCENARIOS[xrScenario].ref[stage])}
function xrSource(){const ref=xrRef(0);XR_DECOYS.forEach(x=>ref.add(x));return ref}
function xrProgress(){return `<div class="xrProg">${['PRE','FLOP','TURN','RIVER'].map((x,i)=>`<span class="${i<xrStage?'done':i===xrStage?'on':''}">${x}</span>`).join('')}</div>`}
function xrGrid(){let out='';for(let r=0;r<13;r++)for(let c=0;c<13;c++){const k=xkey(r,c),alive=xrCandidate.has(k),keep=xrCurrent.has(k);out+=`<button class="xrCell ${alive?'alive':'dead'} ${keep?'keep':'removed'}" data-xc="${k}" ${alive?'':'disabled'}>${k}</button>`}return `<div class="xrGrid">${out}</div>`}
function renderXray(){
 const idx=(S.xray?.runs||0)%XR_SCENARIOS.length,s=XR_SCENARIOS[idx];
 $('#xrayArea').innerHTML=`<div class="xrStage"><span class="ey">◎ РЕНТГЕН · RANGE READING</span><h1 class="impact">НЕ УГАДЫВАЙ РУКУ.<br><span class="pink">УБИВАЙ НЕВОЗМОЖНЫЕ.</span></h1><p class="mut">Здесь нет Fold/Call/Raise. Ты строишь модель оппонента и физически сужаешь её после каждого нового действия.</p><div class="shareCard"><span class="ey">РЕНТГЕН ДНЯ</span><h2>${s.title}</h2><div class="big">${s.counts[0]} → ?</div><p class="mut">combos · ${s.villain}</p></div><div class="xrRule"><b>Главное правило</b><p class="mut">Если ты убил комбинацию на флопе — на ривере воскресить её уже нельзя.</p></div><button class="primary" id="xrStart">ПОЛНЫЙ РЕНТГЕН · 3–5 МИН →</button><button class="secondary" id="xrQuick">БЫСТРЫЙ · С ТЁРНА →</button></div>`;
 $('#xrStart').onclick=()=>xrBegin(0);$('#xrQuick').onclick=()=>xrBegin(2)
}
function xrBegin(stage){xrScenario=(S.xray?.runs||0)%XR_SCENARIOS.length;xrStage=stage;xrScores={pre:0,narrow:0,river:0,blockers:0};xrClass={};if(stage===0){xrCandidate=xrSource();xrCurrent=new Set(xrCandidate)}else{xrCandidate=new Set(XR_SCENARIOS[xrScenario].ref[1]);xrCurrent=new Set(xrCandidate)}renderXrayStage()}
function renderXrayStage(){
 const s=XR_SCENARIOS[xrScenario],n=xrStage===0?0:xrStage===1?3:xrStage===2?4:5;
 $('#xrayArea').innerHTML=`<div class="xrStage"><span class="ey">${s.villain} · ${s.title}</span><h1 class="impact">${xrStage===0?'С ЧЕМ ОН<br><span class="pink">НАЧИНАЕТ?</span>':xrStage===3?'ЧТО ДОЖИЛО<br><span class="pink">ДО РИВЕРА?</span>':'СУЖАЙ<br><span class="pink">ДИАПАЗОН.</span>'}</h1>${xrProgress()}${n?board(s.board.slice(0,n)):''}<div class="verdict"><span class="ey">${['ПРЕФЛОП','ФЛОП','ТЁРН','РИВЕР'][xrStage]}</span><h3>${s.line[xrStage]}</h3><p class="mut">Тапни по рукам, которые это действие больше не переживают.</p></div><div class="xrChoiceBar"><div><span class="ey">ТВОЯ МОДЕЛЬ</span><div class="xrCountLive">${xrCurrent.size} групп</div></div><button class="chip" id="xrReset">ВЕРНУТЬ</button></div>${xrGrid()}<button class="primary" id="xrLock">ЗАФИКСИРОВАТЬ RANGE →</button></div>`;
 $$('[data-xc]').forEach(b=>b.onclick=()=>{const k=b.dataset.xc;if(xrCurrent.has(k)){xrCurrent.delete(k);b.classList.remove('keep');b.classList.add('removed')}else{xrCurrent.add(k);b.classList.add('keep');b.classList.remove('removed')}const c=$('.xrCountLive');if(c)c.textContent=xrCurrent.size+' групп'});
 $('#xrReset').onclick=()=>{xrCurrent=new Set(xrCandidate);renderXrayStage()};$('#xrLock').onclick=xrReveal
}
function f1(user,ref){let tp=0,fp=0,fn=0;user.forEach(k=>ref.has(k)?tp++:fp++);ref.forEach(k=>{if(!user.has(k))fn++});const p=tp/Math.max(1,tp+fp),r=tp/Math.max(1,tp+fn);return Math.round((2*p*r/Math.max(.001,p+r))*100)}
function xrReveal(){
 const s=XR_SCENARIOS[xrScenario],ref=xrRef(xrStage),score=f1(xrCurrent,ref);if(xrStage===0)xrScores.pre=score;else xrScores.narrow=Math.round(((xrScores.narrow||score)+score)/2);
 const extras=[...xrCurrent].filter(k=>!ref.has(k)).length,missing=[...ref].filter(k=>!xrCurrent.has(k)).length;
 $('#xrayArea').innerHTML=`<div class="xrStage"><span class="ey">СРАВНЕНИЕ С БАЗОВОЙ МОДЕЛЬЮ</span><h1 class="impact">${score>=80?'ПОХОЖЕ.<br><span class="pink">ИДЁМ ДАЛЬШЕ.</span>':score>=60?'ЖИВЁТ.<br><span class="pink">НО RANGE ПЛЫВЁТ.</span>':'СЛИШКОМ МНОГО<br><span class="pink">ФАНТАЗИИ.</span>'}</h1>${xrProgress()}<div class="funnel">${s.counts.map((x,i)=>`<div><span class="ey">${['PRE','FLOP','TURN','RIVER'][i]}</span><b>${i<=xrStage?x:'?'}</b></div>`).join('')}</div><div class="grid2"><div class="lab"><span class="ey">ЛИШНИЕ</span><h2 class="red">${extras}</h2></div><div class="lab"><span class="ey">УБИЛ РАНО</span><h2 class="yellow">${missing}</h2></div></div><div class="verdict"><h2>СОВПАДЕНИЕ ${score}</h2><p>${extras>missing?'Ты оставил слишком много рук, которые плохо переживают эту линию.':'Ты местами сузил диапазон быстрее, чем позволяли действия.'}</p></div><p class="pink"><b>${extras?'Риверные блефы нельзя дописать задним числом.':''}</b></p><button class="primary" id="xrNext">${xrStage<3?'ПРОПУСТИТЬ ЧЕРЕЗ СЛЕДУЮЩУЮ УЛИЦУ →':'VALUE / BLUFF →'}</button></div>`;
 $('#xrNext').onclick=()=>{if(xrStage<3){xrStage++;xrCandidate=new Set(xrCurrent);xrCurrent=new Set(xrCandidate);renderXrayStage()}else xrRiver()}
}
function xrRiver(){
 const s=XR_SCENARIOS[xrScenario];xrClass={};const available=s.river.filter(([k])=>xrCurrent.has(k));
 $('#xrayArea').innerHTML=`<div class="xrStage"><span class="ey">РИВЕР · VALUE / BLUFF</span><h1 class="impact">ХВАТИТ ГОВОРИТЬ<br><span class="pink">«У НЕГО ЕСТЬ БЛЕФЫ».</span></h1>${board(s.board)}<p class="mut">Ты можешь классифицировать только то, что реально дожило в твоей модели. Убитые раньше руки не воскресают.</p><div id="riverTokens">${available.length?available.map(([k])=>`<button class="token" data-xt="${k}">${k}</button>`).join(''):'<div class="verdict red">Ты вырезал весь учебный river-range раньше. Это тоже диагноз.</div>'}</div><div class="balance"><div class="col v"><span class="ey">VALUE</span><div id="vZone"></div></div><div class="col b"><span class="ey">BLUFF</span><div id="bZone"></div></div></div><button class="primary" id="riverDone">ПОСЧИТАТЬ ПЛОТНОСТЬ →</button></div>`;
 function redraw(){const v=[],b=[];Object.entries(xrClass).forEach(([k,x])=>(x==='V'?v:b).push(k));$('#vZone').innerHTML=v.map(x=>`<span class="token">${x}</span>`).join('');$('#bZone').innerHTML=b.map(x=>`<span class="token">${x}</span>`).join('')}
 $$('[data-xt]').forEach(b=>b.onclick=()=>{const k=b.dataset.xt,cur=xrClass[k];xrClass[k]=cur==='V'?'B':cur==='B'?undefined:'V';if(!xrClass[k])delete xrClass[k];b.textContent=k+(xrClass[k]==='V'?' · V':xrClass[k]==='B'?' · B':'');redraw()});$('#riverDone').onclick=xrRiverReveal
}
function xrRiverReveal(){
 const s=XR_SCENARIOS[xrScenario],correct=Object.fromEntries(s.river);let good=0,seen=0;Object.entries(xrClass).forEach(([k,v])=>{if(correct[k]){seen++;if(v===correct[k])good++}});xrScores.river=seen?Math.round(good/seen*100):0;const v=s.river.filter(x=>x[1]==='V').length,b=s.river.filter(x=>x[1]==='B').length;
 $('#xrayArea').innerHTML=`<div class="xrStage"><span class="ey">ВСКРЫТИЕ</span><h1 class="impact">ТЕПЕРЬ ЭТО<br><span class="pink">УЖЕ RANGE.</span></h1><div class="balance"><div class="col v"><span class="ey">VALUE GROUPS</span><h2>${v}</h2></div><div class="col b"><span class="ey">BLUFF GROUPS</span><h2>${b}</h2></div></div><div class="verdict"><span class="ey">ДЛЯ УЧЕБНОЙ МОДЕЛИ CALL НУЖНО</span><h1>${s.need} BLUFF GROUPS</h1><p class="${b<s.need?'red':'green'}"><b>Нашли ${b}</b></p></div><p class="pink"><b>${b<s.need?'Блефы закончились раньше, чем желание нажать CALL.':'В этот раз блефы хотя бы не пришлось воскрешать.'}</b></p><button class="primary" id="blockerScan">BLOCKER SCAN →</button></div>`;$('#blockerScan').onclick=xrBlocker
}
function xrBlocker(){const s=XR_SCENARIOS[xrScenario],b=s.block;$('#xrayArea').innerHTML=`<div class="xrStage"><span class="ey">BLOCKER SCAN</span><h1 class="impact">ТЕПЕРЬ ПОСМОТРИ<br><span class="pink">НА СВОИ КАРТЫ.</span></h1>${hand(s.hero)}<div class="balance"><div class="col v"><span class="ey">VALUE</span><h2>${b.beforeV} → <span class="green">${b.afterV}</span></h2></div><div class="col b"><span class="ey">BLUFF</span><h2>${b.beforeB} → <span class="red">${b.afterB}</span></h2></div></div><p>${b.text}</p><div class="grid2"><button class="choice" data-bq="good">ХОРОШИЙ BLOCKER</button><button class="choice" data-bq="bad">ПЛОХОЙ BLOCKER</button></div></div>`;$$('[data-bq]').forEach(x=>x.onclick=()=>{const valueRemoved=Math.max(0,b.beforeV-b.afterV),bluffRemoved=Math.max(0,b.beforeB-b.afterB),expected=bluffRemoved>valueRemoved?'bad':'good';xrScores.blockers=x.dataset.bq===expected?100:45;xrReport()})}
function xrReport(){
 const s=XR_SCENARIOS[xrScenario],parts=[xrScores.pre,xrScores.narrow,xrScores.river,xrScores.blockers].filter(v=>Number.isFinite(v)&&v>0),score=parts.length?Math.round(parts.reduce((a,b)=>a+b,0)/parts.length):0,n=S.xray.runs;S.xray.pre=Math.round((S.xray.pre*n+(xrScores.pre||S.xray.pre))/(n+1));S.xray.narrow=Math.round((S.xray.narrow*n+(xrScores.narrow||S.xray.narrow))/(n+1));S.xray.river=Math.round((S.xray.river*n+(xrScores.river||S.xray.river))/(n+1));S.xray.blockers=Math.round((S.xray.blockers*n+xrScores.blockers)/(n+1));S.xray.runs++;S.xray.best=Math.max(S.xray.best||0,score);S.xray.history.push({date:today(),title:s.title,score});S.xray.history=S.xray.history.slice(-20);save();
 $('#xrayArea').innerHTML=`<div class="xrStage"><span class="ey">RANGE REPORT</span><h1 class="impact">ТЕПЕРЬ ЭТО<br><span class="pink">ПОХОЖЕ НА ЧТЕНИЕ.</span></h1><div class="grid2"><div class="lab"><span class="ey">START RANGE</span><h2>${xrScores.pre||'—'}</h2></div><div class="lab"><span class="ey">NARROWING</span><h2>${xrScores.narrow||'—'}</h2></div><div class="lab"><span class="ey">VALUE / BLUFF</span><h2>${xrScores.river||'—'}</h2></div><div class="lab"><span class="ey">BLOCKERS</span><h2>${xrScores.blockers}</h2></div></div><div class="shareCard"><span class="ey">РЕНТГЕН #${S.xray.runs}</span><div class="big">${s.counts[0]}</div><div>↓ ${s.counts[1]} ↓ ${s.counts[2]} ↓</div><div class="big pink">${s.counts[3]}</div><p><b>RANGE READING ${score}</b></p></div><p class="pink"><b>Не угадывал руку. Просто методично убивал невозможные.</b></p><button class="primary" id="xrAgain">ЕЩЁ ОДИН →</button><button class="secondary" id="xrHome">НА ГЛАВНУЮ</button></div>`;$('#xrAgain').onclick=()=>xrBegin(0);$('#xrHome').onclick=()=>show('home')
}

/* YOU */
function skillValue(obj){return obj.n?Math.round(obj.g/obj.n*100):null}
function renderProfile(){
 const pre=skillValue(S.skills.pre),post=skillValue(S.skills.post),size=skillValue(S.skills.sizing),disc=S.skills.discipline;
 const vals=[pre??50,post??50,size??50,disc],min=Math.min(...vals),xr=S.xray;
 $('#profileArea').innerHTML=`<div class="panel"><span class="ey">YOU · ${S.nick||'REG'}</span><h1 class="impact">ТВОЁ<br><span class="pink">POKER DNA.</span></h1><p class="mut">${S.played} решений · ${S.hands.length} своих рук · ${xr.runs} Рентгенов.</p><div class="dna"><div class="dnaCore"><div><span class="ey">SKILL</span><h2>${S.skill}</h2></div></div>${[['PREFLOP',pre,'n1'],['POSTFLOP',post,'n2'],['SIZING',size,'n3'],['DISCIPLINE',disc,'n4']].map((x,i)=>`<button class="skillNode ${x[2]} ${(x[1]??50)===min?'leak':''}" data-dna="${i}">${x[0]}<b>${x[1]??'—'}</b></button>`).join('')}</div>
 <span class="ey">ТЫ МЕСЯЦ НАЗАД ←→ СЕГОДНЯ</span><input class="scrub" id="timeScrub" type="range" min="0" max="30" value="30"><div id="timeOut" class="verdict"><b>Двигай время.</b><p class="mut">Когда накопятся snapshots, здесь будет реальная динамика.</p></div></div>
 <div class="section"><h3>◎ RANGE READING</h3><button class="choice" id="youXray"><div class="grid2"><div><span class="ey">NARROWING</span><h2>${xr.runs?xr.narrow:'—'}</h2></div><div><span class="ey">BLOCKERS</span><h2>${xr.runs?xr.blockers:'—'}</h2></div></div><span class="pink"><b>${xr.runs?'Посмотри, где ты оставляешь оппоненту лишние руки.':'Пройди первый Рентген — здесь появится новый навык.'}</b></span></button>
 <h3>ПОСЛЕДНИЕ ОШИБКИ</h3>${S.errors.length?S.errors.slice(0,5).map(e=>`<div class="row"><div><b>${e.hand}</b><div class="mut small">${e.why}</div></div><span class="red">●</span></div>`).join(''):'<p class="mut">Пока мало улик.</p>'}
 <button class="primary" id="youHeal">ЛЕЧИТЬ СЛАБОЕ МЕСТО →</button></div>`;
 $('#youXray').onclick=()=>show('xray');$('#youHeal').onclick=()=>show('heal');
 $$('[data-dna]').forEach(b=>b.onclick=()=>openModal(`<span class="ey">POKER DNA</span><h2>${b.textContent.trim()}</h2><p>Score показывается только когда накоплена выборка. До этого — честный прочерк.</p>`));
 $('#timeScrub').oninput=e=>{const days=30-+e.target.value,rows=S.snapshots.filter(x=>Date.now()-new Date(x.date).getTime()<=days*86400000);$('#timeOut').innerHTML=days===0?`<b>СЕГОДНЯ · SKILL ${S.skill}</b>`:`<b>${days} ДНЕЙ НАЗАД</b><p class="mut">${rows[0]?`Сохранённый Skill около ${rows[0].skill}.`:'Данных за эту дату пока нет. Ничего не выдумываем.'}</p>`}
}

/* NAV */
$$('[data-nav]').forEach(b=>b.onclick=()=>show(b.dataset.nav));


/* startup self-check */
function startupSelfCheck(){
  const requiredIds=['onboarding','mainApp','home','swipe','sizing','review','daily','heal','myhands','xray','profile','modal'];
  const missing=requiredIds.filter(id=>!document.getElementById(id));
  if(missing.length) throw new Error('Не хватает обязательных элементов: '+missing.join(', '));
  const fns=[renderHome,renderSwipe,renderSizing,renderReview,renderDaily,renderHeal,renderMy,renderXray,renderProfile];
  if(fns.some(fn=>typeof fn!=='function')) throw new Error('Не загрузились функции экранов.');
}
startupSelfCheck();

/* start */
ui();
renderStory();
});
