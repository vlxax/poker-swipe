<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Фриковая Дама — Poker Prototype</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#05050a;color:#fff;font-family:Inter,Arial,sans-serif}.wrap{max-width:430px;margin:0 auto;min-height:100vh;background:#000}.screen{display:none;position:relative;width:100%;aspect-ratio:1024/1536;overflow:hidden;background:#000}.screen.active{display:block}.screen>img{width:100%;height:100%;object-fit:cover;display:block}.hot{position:absolute;border:0;background:transparent;cursor:pointer;z-index:20}.hot:focus-visible{outline:3px solid #fff8;outline-offset:2px}.handOverlay{position:absolute;left:23%;right:23%;top:24.7%;height:27%;z-index:10;display:flex;align-items:center;justify-content:center;gap:2.5%;pointer-events:none}.pCard{width:39%;height:78%;border-radius:10px;background:#f8f7f3;color:#111;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;padding:8% 7%;font-weight:900;box-shadow:0 10px 18px #0008;transform:rotate(-3deg);font-size:clamp(38px,12vw,58px);line-height:.9}.pCard:nth-child(2){transform:rotate(3deg)}.redSuit{color:#b1161d}.blackSuit{color:#111}.pCard small{font-size:.78em;margin-top:10px}.counterOverlay{position:absolute;left:13.5%;top:5.2%;z-index:12;font-weight:800;font-size:clamp(14px,4vw,20px);background:#05050ac9;padding:2px 6px;border-radius:6px}.ladyOverlay{position:absolute;left:27%;right:7%;top:70.7%;height:15%;z-index:12;background:rgba(8,7,13,.92);border:1px solid #3a2c4b;border-radius:12px;padding:10px 12px;color:#eee;display:flex;flex-direction:column;justify-content:center;pointer-events:none}.ladyOverlay b{color:#c64cff;font-size:clamp(12px,3.6vw,18px);margin-bottom:6px}.ladyOverlay span{font-size:clamp(11px,3.2vw,16px);line-height:1.35}.verdictOverlay{position:absolute;left:49%;right:6%;top:15.5%;height:40%;z-index:12;background:linear-gradient(90deg,rgba(5,5,10,.55),rgba(5,5,10,.96));display:flex;align-items:center;padding:8px}.verdictOverlay div{font-weight:900;font-size:clamp(18px,5vw,29px);line-height:1.15;text-transform:uppercase}.verdictOverlay em{font-style:normal;color:#d049ff}.scoreOverlay{position:absolute;left:8%;top:62.5%;z-index:13;font-size:clamp(13px,4vw,20px);font-weight:900;color:#78ef66;background:#06060a;padding:3px 8px;border-radius:6px}.toast{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);z-index:50;background:#111e;border:1px solid #444;border-radius:999px;padding:8px 14px;font-size:12px;display:none}.toast.show{display:block}
</style>
</head>
<body><div class="wrap">
  <section id="home" class="screen active">
    <img src="assets/home.png" alt="Главный экран" />
    <button id="startSwipe" class="hot" aria-label="Начать свайп-тест" style="left:49%;top:35%;width:46%;height:9%"></button>
  </section>

  <section id="question" class="screen">
    <img src="assets/question-aj.png" alt="Раздача свайп-теста" />
    <div id="counter" class="counterOverlay">1 / 15</div>
    <div class="handOverlay"><div id="card1" class="pCard"></div><div id="card2" class="pCard"></div></div>
    <button class="hot decision" data-action="fold" aria-label="Фолд" style="left:3%;top:74%;width:30%;height:17%"></button>
    <button class="hot decision" data-action="call" aria-label="Колл" style="left:34.5%;top:74%;width:30%;height:17%"></button>
    <button class="hot decision" data-action="raise" aria-label="Рейз" style="left:66%;top:74%;width:30%;height:17%"></button>
  </section>

  <section id="match" class="screen resultScreen">
    <img src="assets/match.png" alt="Правильное решение" />
    <div class="ladyOverlay"><b>ФРИКОВАЯ ДАМА</b><span class="snark"></span></div>
    <button class="hot nextBtn" aria-label="Следующая рука" style="left:25%;top:84%;width:70%;height:7%"></button>
  </section>
  <section id="yellow" class="screen resultScreen">
    <img src="assets/yellow.png" alt="Среднее решение" />
    <div class="ladyOverlay"><b>ФРИКОВАЯ ДАМА</b><span class="snark"></span></div>
    <button class="hot nextBtn" aria-label="Следующая рука" style="left:25%;top:84%;width:70%;height:7%"></button>
  </section>
  <section id="red" class="screen resultScreen">
    <img src="assets/red.png" alt="Неправильное решение" />
    <div class="ladyOverlay"><b>ФРИКОВАЯ ДАМА</b><span class="snark"></span></div>
    <button class="hot nextBtn" aria-label="Следующая рука" style="left:25%;top:84%;width:70%;height:7%"></button>
  </section>

  <section id="last" class="screen">
    <img src="assets/question-22.png" alt="Последняя рука" />
    <div id="lastCards" class="handOverlay"><div id="last1" class="pCard"></div><div id="last2" class="pCard"></div></div>
    <button id="resultBtn" class="hot" aria-label="Узнать результат" style="left:22%;top:89%;width:57%;height:6%"></button>
  </section>

  <section id="verdict" class="screen">
    <img src="assets/verdict.png" alt="Финальный вердикт" />
    <div class="verdictOverlay"><div id="verdictQuote"></div></div>
    <div id="score" class="scoreOverlay">0 / 15</div>
    <button id="continueBtn" class="hot" aria-label="Продолжить" style="left:49%;top:87%;width:47%;height:6%"></button>
  </section>
</div>
<script>
const hands=[
['A','♠','J','♥','raise'],['K','♥','10','♣','raise'],['Q','♠','10','♦','fold'],['A','♦','9','♦','raise'],['7','♠','6','♠','raise'],['K','♣','Q','♣','raise'],['A','♣','5','♣','raise'],['J','♠','8','♦','fold'],['10','♠','10','♥','raise'],['A','♥','Q','♥','raise'],['K','♦','7','♣','call'],['9','♣','9','♦','raise'],['Q','♥','J','♥','raise'],['A','♠','4','♦','fold'],['2','♥','2','♣','raise']
];
const snarks={match:['Надо же. Сегодня кнопки нажимаются не наугад.','Очень интересно. Особенно приятно, что в этот раз оно ещё и правильное.','Поздравляю: одну раздачу ты не подарил полю.'],yellow:['Жить можно. Богато — пока рано.','Не катастрофа. Но GTO Wizard где-то тихо закрыл вкладку.','Среднее решение: банкролл жив, самолюбие тоже.'],red:['Красиво. Банкролл оценил и попросил больше так не делать.','Ты снова выбрал характер вместо диапазона. Очень по-человечески.','Если целью было порадовать регуляров — выполнено идеально.']};
const verdicts={high:['15 рук позади, а ты всё ещё <em>играешь лучше, чем 90% регов</em> на этом лимите. Не расслабляйся.','Неприятные новости для поля: <em>ты начал думать до клика</em>.'],mid:['Банкролл выжил. Уже достижение. <em>Теперь попробуй ещё и принимать решения</em>.','Ты уже не турист, но <em>регом тебя пока называть опасно</em>.'],low:['Сегодня GTO Wizard был открыт… <em>на соседнем ноутбуке</em>.','15 рук позади. <em>Диапазоны тоже были где-то рядом</em>, но вы разминулись.']};
let i=0,correct=0;
const all=['home','question','match','yellow','red','last','verdict'];
function show(id){all.forEach(x=>document.getElementById(x).classList.toggle('active',x===id));}
function suitClass(s){return (s==='♥'||s==='♦')?'redSuit':'blackSuit'}
function setCard(el,rank,suit){el.className='pCard '+suitClass(suit);el.innerHTML=`${rank}<small>${suit}</small>`}
function renderHand(){const h=hands[i];counter.textContent=`${i+1} / 15`;setCard(card1,h[0],h[1]);setCard(card2,h[2],h[3]);}
function random(arr){return arr[Math.floor(Math.random()*arr.length)]}
function choose(a){const h=hands[i],ok=a===h[4];let type;if(ok){correct++;type='match'}else if((a==='call'&&h[4]==='raise')||(a==='fold'&&h[4]==='call')) type='yellow'; else type='red';document.querySelector(`#${type} .snark`).textContent=random(snarks[type]);show(type)}
startSwipe.addEventListener('click',()=>{i=0;correct=0;renderHand();show('question')});
document.querySelectorAll('.decision').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.action)));
document.querySelectorAll('.nextBtn').forEach(b=>b.addEventListener('click',()=>{i++;if(i===14){const h=hands[i];setCard(last1,h[0],h[1]);setCard(last2,h[2],h[3]);show('last')}else{renderHand();show('question')}}));
resultBtn.addEventListener('click',()=>{const pct=correct/15;const tier=pct>=.8?'high':pct>=.5?'mid':'low';verdictQuote.innerHTML=random(verdicts[tier]);score.textContent=`${correct} / 15`;show('verdict')});
continueBtn.addEventListener('click',()=>show('home'));
</script>
</body></html>
