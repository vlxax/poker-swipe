<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#08080c"/>
  
  <!-- Radial gradient -->
  <defs>
    <radialGradient id="grad512" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#c8ff3d;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#08080c;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <rect width="512" height="512" fill="url(#grad512)"/>
  
  <!-- Spade symbol (poker card suit) -->
  <g transform="translate(256, 256)">
    <!-- Spade icon -->
    <path d="M 0,-179.2 L 128,-76.8 L 76.8,51.2 Q 0,128 -76.8,51.2 L -128,-76.8 Z" 
          fill="#c8ff3d" stroke="#42e786" stroke-width="10.24"/>
    <!-- Stem -->
    <rect x="-25.6" y="51.2" width="51.2" height="102.4" fill="#42e786"/>
  </g>
</svg>