<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Background -->
  <rect width="180" height="180" fill="#08080c"/>
  
  <!-- Radial gradient -->
  <defs>
    <radialGradient id="grad180" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#c8ff3d;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#08080c;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <rect width="180" height="180" fill="url(#grad180)"/>
  
  <!-- Spade symbol (poker card suit) -->
  <g transform="translate(90, 90)">
    <!-- Spade icon -->
    <path d="M 0,-62.99999999999999 L 45,-27 L 27,18 Q 0,45 -27,18 L -45,-27 Z" 
          fill="#c8ff3d" stroke="#42e786" stroke-width="3.6"/>
    <!-- Stem -->
    <rect x="-9" y="18" width="18" height="36" fill="#42e786"/>
  </g>
</svg>