<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_9 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_9" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_9');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);
const pointLight = new THREE.PointLight(0xdfff00, 2, 10);
pointLight.position.set(2, 2, 2);
scene.add(pointLight);

// Poker Chip Geometry
const chipGroup = new THREE.Group();

// Main body
const cylinderGeom = new THREE.CylinderGeometry(1, 1, 0.15, 64);
const chipMaterial = new THREE.MeshPhongMaterial({ 
  color: 0x1a1a1a,
  shininess: 100,
  specular: 0x333333
});
const body = new THREE.Mesh(cylinderGeom, chipMaterial);
chipGroup.add(body);

// Neon rings
const ringGeom = new THREE.TorusGeometry(0.9, 0.02, 16, 100);
const neonMaterial = new THREE.MeshBasicMaterial({ color: 0xdfff00 });
const ringTop = new THREE.Mesh(ringGeom, neonMaterial);
ringTop.rotation.x = Math.PI / 2;
ringTop.position.y = 0.08;
chipGroup.add(ringTop);

const ringBottom = ringTop.clone();
ringBottom.position.y = -0.08;
chipGroup.add(ringBottom);

// Detail stripes on the edge
for (let i = 0; i < 8; i++) {
  const stripeGeom = new THREE.BoxGeometry(0.1, 0.16, 0.1);
  const stripe = new THREE.Mesh(stripeGeom, neonMaterial);
  const angle = (i / 8) * Math.PI * 2;
  stripe.position.x = Math.cos(angle) * 1;
  stripe.position.z = Math.sin(angle) * 1;
  stripe.lookAt(0, 0, 0);
  chipGroup.add(stripe);
}

scene.add(chipGroup);
camera.position.z = 3;

// Animation
function animate() {
  requestAnimationFrame(animate);
  chipGroup.rotation.y += 0.01;
  chipGroup.rotation.x += 0.005;
  
  // Gentle floating motion
  chipGroup.position.y = Math.sin(Date.now() * 0.002) * 0.1;
  
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_9 -->
</body>
</html>
