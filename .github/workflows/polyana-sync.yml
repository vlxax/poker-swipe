name: Update Polyana live data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  sync-polyana:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update Polyana data
        run: node scripts/sync_polyana.mjs

      - name: Commit updated data
        run: |
          git config user.name "PokerSwipe Bot"
          git config user.email "actions@github.com"

          git add data/polyana_live.json

          if git diff --cached --quiet; then
            echo "No Polyana changes"
            exit 0
          fi

          git commit -m "Update Polyana live data"
          git push
