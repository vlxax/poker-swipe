<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f42b91">
<title>Фриковая Дама — Свайп-тест</title>
<style>

:root{
  --bg1:#ff7bc8;
  --bg2:#ff4fa8;
  --bg3:#f42b91;
  --panel:#fff2f8;
  --panel2:#ffd9eb;
  --ink:#161016;
  --muted:#7d6876;
  --purple:#7d2dd2;
  --purple2:#a953ff;
  --red:#ff4057;
  --green:#32c85e;
  --yellow:#f0c53d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#f42b91;font-family:Inter,Arial,sans-serif;color:var(--ink)}
button{font:inherit}
.app{width:min(100%,430px);min-height:100vh;margin:0 auto;background:linear-gradient(180deg,var(--bg1),var(--bg2) 45%,var(--bg3));overflow:hidden}
.screen{display:none;min-height:100vh}.screen.active{display:block}
.home{position:relative;min-height:100vh;background:#f450a2;overflow:hidden}
.home img{width:100%;height:100vh;object-fit:cover;display:block}
.homeTap{position:absolute;left:7%;right:7%;bottom:11%;height:12%;border:0;background:transparent;border-radius:28px;cursor:pointer}
.homeTap:active{transform:scale(.97)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px;color:#111}
.back{border:0;background:rgba(255,255,255,.45);width:44px;height:44px;border-radius:50%;font-size:24px}
.title{font-size:25px;font-weight:1000}
.count{background:rgba(255,255,255,.45);padding:10px 14px;border-radius:999px;font-weight:900}
.gameWrap{padding:0 14px 18px}
.pokerCard{background:rgba(255,245,250,.93);border:1px solid rgba(255,255,255,.75);border-radius:28px;padding:18px;box-shadow:0 20px 60px rgba(100,20,70,.22);backdrop-filter:blur(14px)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.metaBox{background:rgba(255,255,255,.72);border:1px solid #ffc2df;border-radius:18px;padding:13px;text-align:center}
.metaBox small{display:block;color:var(--muted);font-size:11px}.metaBox b{font-size:20px;color:#e31c82}
.cards{display:flex;justify-content:center;gap:12px;margin:18px 0}
.card{width:122px;height:170px;background:#fff;color:#111;border-radius:18px;box-shadow:0 14px 30px rgba(77,14,49,.2);padding:14px;display:flex;flex-direction:column;justify-content:space-between;font-weight:900}
.card.red{color:#d61430}.rank{font-size:48px}.suit{font-size:58px;align-self:flex-end}
.question{text-align:center;font-size:29px;line-height:1.05;font-weight:1000;margin-top:12px}
.situation{text-align:center;font-size:15px;margin:10px 0 16px;color:#5d4855}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.info div{background:rgba(255,255,255,.66);border:1px solid #ffc2df;border-radius:16px;padding:10px;text-align:center}
.info small{display:block;font-size:10px;color:#8d7281}.info b{font-size:14px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.action{border:0;border-radius:20px;color:#fff;padding:18px 3px;font-size:18px;font-weight:1000;box-shadow:0 10px 24px rgba(0,0,0,.15);transition:.09s}
.action:active,.next:active{transform:scale(.95);filter:brightness(1.12)}
.fold{background:linear-gradient(#ff5163,#c71932)}
.call{background:linear-gradient(#48db70,#1d9c43)}
.raise{background:linear-gradient(#b151f3,#6d1cb3)}
.resultWrap{padding:18px 14px}
.resultBox{background:rgba(255,246,251,.95);border-radius:28px;padding:18px;box-shadow:0 20px 60px rgba(100,20,70,.22);text-align:center}
.flag{font-size:36px;font-weight:1000}.flag.match{color:#25b857}.flag.yellow{color:#d4aa00}.flag.red{color:#e51e40}
.resultTitle{font-size:23px;font-weight:1000;margin:6px 0}.explain{font-size:16px;line-height:1.45}
.ladyBox{margin:16px 0 14px;text-align:left;background:#ffe2f0;border:1px solid #ffb9da;border-radius:18px;padding:14px}
.ladyBox b{color:#9b27d7}.ladyBox p{margin:7px 0 0;line-height:1.45;font-size:15px}
.next{width:100%;border:0;border-radius:18px;padding:17px;color:#fff;background:linear-gradient(90deg,#7f2dd5,#a34df2);font-weight:1000;font-size:18px}
.verdictWrap{padding:18px 14px}
.verdictBox{background:rgba(255,246,251,.96);border-radius:28px;padding:20px;box-shadow:0 20px 60px rgba(100,20,70,.22)}
.verdictHead{text-align:center}.verdictHead h1{margin:5px 0;color:#991fc9}.verdictHead .kiss{font-size:54px}
.bigRoast{margin:18px 0;background:#ffe0ef;border:1px solid #ffb3d5;border-radius:20px;padding:16px;font-size:17px;line-height:1.55}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:#fff;border:1px solid #ffc2df;border-radius:16px;padding:12px 6px;text-align:center}.metric small{display:block;color:#8f7382;font-size:10px}.metric b{font-size:18px}
.footerNote{text-align:center;color:#7b5d6d;margin-top:10px;font-size:12px}

</style>
</head>

    `Ну что, гений. 15 рук позади, и теперь у нас есть статистическое подтверждение того, что «похуй call» — это не стратегия, а образ жизни. Ты умудрился смотреть на позиции, стеки, диапазоны и всё равно периодически выбирать действие так, будто главная цель — порадовать остальных за столом. Ты не эксплуатировал поле. Поле эксплуатировало твою любовь к красивым историям. Где надо было фолдить — ты искал подвиг. Где надо было рейзить — внезапно становился философом ненасилия. Где можно было спокойно коллировать — включал режиссёра блокбастера. Это не приговор. Но прежде чем снова садиться играть, попробуй одну революционную вещь: сначала подумать, потом нажать.`,
    `Я бы написала тебе мягкий разбор, но ты уже достаточно мягко сыграл эти 15 рук. Поэтому нет. Ты сейчас не «нестандартный игрок», не «эксплойтный гений» и не «человек, который чувствует динамику». Ты просто слишком часто платишь за желание быть интересным. Покер вообще неприятная игра: ему плевать на твою харизму. Он любит скучных людей, которые умеют фолдить, считать и повторять прибыльные действия. Возвращайся ещё раз. И в следующий заход попробуй хотя бы не воевать с каждой раздачей лично.`
  ]
};

function rand(arr){ return arr[Math.floor(Math.random()*arr.length)] }

function show(id){
  $$(".screen").forEach(s=>s.classList.toggle("active",s.id===id));
  window.scrollTo(0,0);
}

function cardHTML([rank,suit]){
  const red = suit==="♥" || suit==="♦";
  return `<div class="card ${red?"red":""}"><div class="rank">${rank}</div><div class="suit">${suit}</div></div>`;
}

function render(){
  const h = HANDS[state.index];
  $("#handCount").textContent = `${state.index+1} / ${HANDS.length}`;
  $("#cards").innerHTML = h.cards.map(cardHTML).join("");
  $("#pot").textContent = h.pot;
  $("#stack").textContent = h.stack;
  $("#position").textContent = h.position;
  $("#stage").textContent = h.stage;
  $("#situation").textContent = h.situation;
}

function start(){
  Object.assign(state,{index:0,score:0,yellow:0,red:0,history:[]});
  render();
  show("game");
}

function choose(action){
  const h = HANDS[state.index];
  const r = h.actions[action];
  state.history.push({id:h.id,action,grade:r.grade});
  if(r.grade==="match") state.score++;
  if(r.grade==="yellow") state.yellow++;
  if(r.grade==="red") state.red++;

  $("#resultCards").innerHTML = h.cards.map(cardHTML).join("");
  $("#flag").className = `flag ${r.grade}`;
  $("#flag").textContent = r.grade==="match" ? "MATCH ❤️" : r.grade==="yellow" ? "YELLOW FLAG 🚩" : "RED FLAG 🚩";
  $("#resultTitle").textContent = r.grade==="match" ? "Правильное решение" : r.grade==="yellow" ? "Среднее решение" : "Неправильное решение";
  $("#explain").textContent = r.explain;
  $("#ladyText").textContent = r.grade==="match" ? rand(praise) : r.grade==="yellow" ? rand(toxicYellow) : rand(toxicWrong);
  show("result");
}

function next(){
  state.index++;
  if(state.index>=HANDS.length){ finish(); return; }
  render(); show("game");
}

function finish(){
  const s = state.score;
  let tier = s>=13 ? "excellent" : s>=10 ? "good" : s>=7 ? "medium" : s>=4 ? "bad" : "disaster";
  $("#bigRoast").textContent = rand(finals[tier]);
  $("#score").textContent = `${state.score} / 15`;
  $("#yellowCount").textContent = state.yellow;
  $("#redCount").textContent = state.red;
  show("verdict");
}

$("#homeTap").addEventListener("click", start);
$("#backHome").addEventListener("click", ()=>show("home"));
$$(".action").forEach(b=>b.addEventListener("click",()=>choose(b.dataset.action)));
$("#nextHand").addEventListener("click",next);
$("#again").addEventListener("click",start);
$("#homeBtn").addEventListener("click",()=>show("home"));

</script>
</body>
</html>
